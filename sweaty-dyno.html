<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweaty Dyno · Dynasty League</title>
<meta name="description" content="Bank, empire pot, minigames, rookie drafts, trades and stats for the Sweaty Dyno dynasty league.">
<meta name="theme-color" content="#0A0D11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FF6B2C'/><text x='16' y='23' font-family='Helvetica,Arial' font-size='17' font-weight='bold' text-anchor='middle' fill='%23160800'>SD</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   SWEATY DYNO — visual system
   Dark telemetry / broadcast aesthetic. Mobile-first.
   ============================================================ */

:root{
  /* ground — a wider value range so cards read as separate planes */
  --bg:#0E131A;
  --bg-2:#141B24;
  --surface:#1B232E;
  --surface-2:#242E3B;
  --surface-3:#303B4A;
  --line:#38445600;
  --line:#374355;
  --line-soft:#28323F;

  /* ink */
  --ink:#EDF2F8;
  --ink-2:#B4C1D1;
  --ink-3:#7C8BA0;

  /* signal */
  --heat:#FF6B2C;        /* primary — the dyno needle */
  --heat-dim:#7A3216;
  --mint:#3DDC97;        /* money in / good */
  --gold:#F5C451;        /* champion / empire */
  --violet:#9C8CFA;      /* empire pot */
  --red:#FF4D5E;         /* owed / out */
  --blue:#5AC8FA;

  /* position chips */
  --qb:#F5695F; --rb:#3DDC97; --wr:#5AC8FA; --te:#F5A94C; --pk:#9C8CFA;

  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.6);
  --tab-h:64px;

  --f-display:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
/* faint carbon weave + top heat bloom */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(110% 55% at 50% -8%, rgba(255,107,44,.13), transparent 62%),
    radial-gradient(70% 45% at 100% 12%, rgba(156,140,250,.09), transparent 65%),
    radial-gradient(80% 50% at 0% 68%, rgba(61,220,151,.055), transparent 68%),
    linear-gradient(180deg, rgba(255,255,255,.022), transparent 34%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.016) 0 1px, transparent 1px 5px);
}
h1,h2,h3,h4{margin:0; font-family:var(--f-display); font-weight:700; letter-spacing:.01em; line-height:1.1}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,select,textarea{font:inherit; color:inherit; font-variant-numeric:tabular-nums}
table{border-collapse:collapse; width:100%}

.ic{width:18px;height:18px;flex:none;stroke-width:2}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.mono{font-family:var(--f-display); font-weight:600; letter-spacing:.02em}
.dim{color:var(--ink-2)} .dimmer{color:var(--ink-3)}
.pos{color:var(--mint)} .neg{color:var(--red)}
.center{text-align:center} .right{text-align:right}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{position:relative; z-index:1; min-height:100dvh; display:flex; flex-direction:column}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:linear-gradient(180deg, rgba(14,19,26,.96), rgba(14,19,26,.80));
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(145deg,var(--heat),#C43D0E);
  display:grid;place-items:center; font-family:var(--f-display); font-weight:700;
  font-size:19px; color:#12070208; color:#160800; letter-spacing:-.02em;
  box-shadow:0 0 0 1px rgba(255,255,255,.10) inset, 0 6px 18px -6px rgba(255,107,44,.7);
}
.brand .txt{min-width:0}
.brand h1{font-size:21px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap}
.brand small{display:block; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin-top:1px}

.season-pick{
  margin-left:auto; display:flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:6px 6px 6px 12px;
}
.season-pick label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.season-pick select{
  background:var(--surface-2); border:1px solid var(--line); border-radius:999px;
  padding:4px 8px; font-family:var(--f-display); font-weight:700; font-size:15px; letter-spacing:.03em;
}

main{flex:1; padding:18px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px); max-width:1180px; width:100%; margin:0 auto}

/* ---------- nav ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:rgba(18,24,32,.94); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:var(--tab-h); color:var(--ink-3); position:relative;
  transition:color .16s;
}
.tabbar button span{font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600}
.tabbar button svg{width:21px;height:21px;stroke-width:1.9}
.tabbar button[aria-current="page"]{color:var(--heat)}
.tabbar button[aria-current="page"]::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:26px; height:2px; background:var(--heat); border-radius:0 0 3px 3px;
  box-shadow:0 0 12px var(--heat);
}
.sidenav{display:none}

/* "More" sheet */
.sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed; left:0;right:0;bottom:0; z-index:61;
  background:var(--surface); border-top:1px solid var(--line);
  border-radius:var(--r-xl) var(--r-xl) 0 0; padding:10px 14px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(102%); transition:transform .26s cubic-bezier(.2,.8,.2,1);
}
.sheet.open{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--surface-3);margin:6px auto 14px}
.sheet a,.sheet button.sheet-item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 12px; border-radius:var(--r); text-decoration:none;
  font-weight:600; letter-spacing:.01em;
}
.sheet button.sheet-item:active{background:var(--surface-2)}
.sheet button.sheet-item svg{width:20px;height:20px;color:var(--ink-3);stroke-width:1.9}
.sheet button.sheet-item[aria-current="page"]{background:var(--surface-2); color:var(--heat)}
.sheet button.sheet-item[aria-current="page"] svg{color:var(--heat)}

/* ---------- primitives ---------- */
.card{
  position:relative;
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);
}
.card::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 38%);
}
.card > *{position:relative}
.card + .card{margin-top:14px}
.card-hd{
  display:flex; align-items:center; gap:10px;
  padding:14px 16px; border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
}
.card-hd h2,.card-hd h3{font-size:16px; text-transform:uppercase; letter-spacing:.07em}
.card-hd .sub{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.card-hd .spacer{margin-left:auto}
.card-bd{padding:16px}
.card-bd.flush{padding:0}

.section-title{
  font-family:var(--f-display); font-size:12px; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3);
  margin:26px 0 10px; display:flex; align-items:center; gap:10px;
}
.section-title::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--line),transparent)}

/* The +/- marker is a real element with two bars, inserted only on titles that
   actually toggle — so it is never an affordance that does nothing. The vertical
   bar collapses into the horizontal one, turning the plus into a minus. */
.section-title[aria-expanded]{cursor:pointer;user-select:none}
.section-title[aria-expanded]:hover{color:var(--ink-2)}
.section-title[aria-expanded]:focus-visible{outline:2px solid var(--heat);outline-offset:3px;border-radius:4px}
.section-title[aria-expanded="false"]{color:var(--ink-2)}

/* Two real bars, not pseudo-elements: Chrome does not reliably restyle a
   pseudo when an ANCESTOR's attribute changes, which left the plus stuck as a
   minus. The state class lives on the marker itself. */
.sec-mark{position:relative;width:13px;height:13px;flex:none;display:block}
.sec-mark b{position:absolute;background:var(--heat);opacity:.85;border-radius:2px;
  transition:opacity .16s ease}
.sec-mark b:first-child{left:0;right:0;top:50%;height:2px;margin-top:-1px}
.sec-mark b:last-child{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
.sec-mark.open b:last-child{display:none}
.section-title[aria-expanded]:hover .sec-mark b{opacity:1}

.sec-body[hidden]{display:none}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2); white-space:nowrap;
}
.chip.heat{color:var(--heat);border-color:rgba(255,107,44,.35);background:rgba(255,107,44,.10)}
.chip.mint{color:var(--mint);border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.09)}
.chip.gold{color:var(--gold);border-color:rgba(245,196,81,.32);background:rgba(245,196,81,.10)}
.chip.violet{color:var(--violet);border-color:rgba(156,140,250,.32);background:rgba(156,140,250,.10)}
.chip.red{color:var(--red);border-color:rgba(255,77,94,.32);background:rgba(255,77,94,.10)}
.chip.ghost{background:transparent}
.chip.plain{text-transform:none;letter-spacing:.01em;font-weight:600;font-size:11.5px}

.pos-chip{
  display:inline-grid;place-items:center; width:26px;height:17px;border-radius:4px;
  font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  color:#080C10; flex:none;
}
.pos-QB{background:var(--qb)} .pos-RB{background:var(--rb)} .pos-WR{background:var(--wr)}
.pos-TE{background:var(--te)} .pos-K{background:var(--pk)}
.pos-none{background:var(--surface-3); color:var(--ink-3)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface-2); font-size:13px;font-weight:600;letter-spacing:.02em;
  transition:background .14s,border-color .14s;
}
.btn:active{background:var(--surface-3)}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn.primary{background:var(--heat);border-color:var(--heat);color:#160800}
.btn.primary:active{background:#E85D22}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.4;pointer-events:none}

/* team identity dot — hue derived from team number */
.tname{display:inline-flex;align-items:center;gap:8px;min-width:0}
.tname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnum{
  font-family:var(--f-display);font-size:10px;font-weight:700;color:var(--ink-3);
  letter-spacing:.06em; background:var(--surface-2); border:1px solid var(--line);
  border-radius:4px; padding:1px 2px; flex:none;
  min-width:26px; text-align:center; box-sizing:border-box;   /* T1 and T10 align */
}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hero{display:flex;flex-direction:column;gap:14px}
.tile{
  --tint:255,255,255;
  background:
    linear-gradient(165deg, rgba(var(--tint),.17), rgba(var(--tint),.05) 44%, transparent 76%),
    linear-gradient(165deg,var(--surface),var(--bg-2));
  border:1px solid var(--line); border-radius:var(--r); padding:13px 14px; position:relative; overflow:hidden;
}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg, rgb(var(--tint)), rgba(var(--tint),.12));opacity:.85}
.tile::after{content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 42%)}
.tile.bare{background:none;border:none;padding:0}
.tile.bare::before,.tile.bare::after{display:none}
.tile.accent{--tint:255,107,44}
.tile.mint{--tint:61,220,151}
.tile.gold{--tint:245,196,81}
.tile.violet{--tint:156,140,250}
.tile.red{--tint:255,77,94}
.tile:not(.accent):not(.mint):not(.gold):not(.violet):not(.red){--tint:132,166,214}
.tile .k{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;margin-top:5px;letter-spacing:.005em}
.tile .m{font-size:11px;color:var(--ink-3);margin-top:3px}
.tile.accent .v{color:var(--heat)} .tile.mint .v{color:var(--mint)}
.tile.gold .v{color:var(--gold)} .tile.violet .v{color:var(--violet)}
.tile.red .v{color:var(--red)}

/* data rows */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--line-soft);
}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.row .val{font-family:var(--f-display);font-size:19px;font-weight:700;flex:none}

/* meter */
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter > i{display:block;height:100%;border-radius:99px;background:var(--heat);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.meter.mint > i{background:var(--mint)} .meter.violet > i{background:linear-gradient(90deg,var(--violet),#C9BDFF)}
.meter.gold > i{background:var(--gold)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{font-size:13px; min-width:100%}
table.dt th{
  text-align:left;font-family:var(--f-display);font-size:11px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--bg-2);z-index:1;
}
table.dt td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.dt tbody tr:last-child td{border-bottom:none}
table.dt tbody tr.total td{border-top:1px solid var(--line);font-weight:700;background:rgba(255,255,255,.022)}
table.dt td.n,table.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
table.dt td.sticky,table.dt th.sticky{
  position:sticky;left:0;background:var(--bg-2);z-index:2;
  box-shadow:1px 0 0 var(--line-soft);
}
table.dt th.sticky{z-index:3}

/* empty state */
.empty{padding:34px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:34px;height:34px;stroke-width:1.4;color:var(--surface-3);margin-bottom:10px}
.empty p{margin:0 0 4px;font-weight:600;color:var(--ink-2);font-size:14px}
.empty small{font-size:12px;line-height:1.6;display:block;max-width:34ch;margin:0 auto}

/* banner */
.banner{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);
  background:rgba(255,107,44,.07);border:1px solid rgba(255,107,44,.26);font-size:12.5px;line-height:1.5;
}
.banner svg{width:17px;height:17px;color:var(--heat);flex:none;margin-top:1px;stroke-width:2}
.banner b{color:var(--heat)}

/* ---------- gauge (dashboard hero) ---------- */
.gauge-card{position:relative;overflow:hidden;padding:20px 16px 18px;text-align:center}
.gauge-card::before{
  content:"";position:absolute;left:50%;top:-40%;transform:translateX(-50%);
  width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,107,44,.16),transparent 62%);pointer-events:none;
}
.gauge{position:relative;width:230px;max-width:82vw;margin:0 auto;display:block}
.gauge-val{
  position:absolute;left:0;right:0;top:52%;transform:translateY(-50%);text-align:center;pointer-events:none;
}
.gauge-val .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.01em}
.gauge-val .lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;font-weight:700}
.gauge-legend{display:flex;justify-content:center;gap:18px;margin-top:2px;flex-wrap:wrap}
.gauge-legend div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2)}
.gauge-legend i{width:8px;height:8px;border-radius:2px;display:block}

/* ---------- draft board ---------- */
.board{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 8px}
.board-grid{display:grid;gap:7px;padding:0 16px 4px;min-width:max-content}
.board-head{
  display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:flex-end;
  padding:8px 6px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);
}
.board-head .sl{font-family:var(--f-display);font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.1em}
.board-head .nm{font-size:11.5px;font-weight:700;white-space:nowrap}
.pick{
  width:132px;padding:8px 9px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;
}
.pick .no{font-family:var(--f-display);font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.08em}
.pick .pl{font-size:12.5px;font-weight:600;line-height:1.25}
.pick .via{
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--heat);display:flex;align-items:center;gap:4px;
}
.pick.traded{border-color:rgba(255,107,44,.34)}
.pick.traded::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--heat);
}
.pick .top{display:flex;align-items:center;gap:6px}
.pick.blank{background:repeating-linear-gradient(45deg,var(--surface) 0 6px,transparent 6px 12px);opacity:.5}

/* ---------- trades ---------- */
.trade{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.trade + .trade{margin-top:10px}
.trade-hd{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
.trade-hd .d{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.trade-body{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft)}
.trade-side{background:var(--surface);padding:11px 13px}
.trade-side .who{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.trade-side .who b{font-size:13.5px}
.trade-side .who .arrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.trade-side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.trade-side li{display:flex;align-items:center;gap:7px;font-size:13px}
.trade-side li .pk{color:var(--ink-2);font-style:italic}
.cond{padding:11px 13px;background:rgba(156,140,250,.06);border-top:1px solid var(--line-soft);font-size:12.5px;line-height:1.55}
.cond .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);font-weight:700;margin-bottom:4px}
.cond .out{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);color:var(--ink-2)}

/* ---------- guillotine ---------- */
.guillo{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border-radius:var(--r);overflow:hidden}
.guillo .g-row{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--surface)}
.guillo .g-row.out{background:var(--bg-2)}
.guillo .g-row.out .tname b{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px;color:var(--ink-3)}
.guillo .wk{font-family:var(--f-display);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;flex:none}
.guillo .g-row.alive .wk{color:var(--mint);border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.08)}

/* ---------- forms / editor ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.field input,.field select,.field textarea{
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;font-size:15px; width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--heat);box-shadow:0 0 0 3px rgba(255,107,44,.14)}
.field textarea{resize:vertical;min-height:66px;line-height:1.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.toggle{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .tr{width:38px;height:22px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line);
  position:relative;transition:background .18s;flex:none}
.toggle .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--ink-2);transition:transform .18s,background .18s}
.toggle input:checked + .tr{background:var(--heat);border-color:var(--heat)}
.toggle input:checked + .tr::after{transform:translateX(16px);background:#160800}

/* pill switcher */
.pills{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink-2);
}
.pills button[aria-pressed="true"]{background:var(--heat);border-color:var(--heat);color:#160800}

/* modal */
.modal-bd{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.66);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bd.open{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl) var(--r-xl) 0 0;
  transform:translateY(20px);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  padding:0 0 calc(env(safe-area-inset-bottom) + 16px);
}
.modal-bd.open .modal{transform:translateY(0)}
.modal-hd{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line-soft);z-index:2}
.modal-hd h3{font-size:17px;text-transform:uppercase;letter-spacing:.06em}
.modal-bd2{padding:16px 18px}
.modal-ft{display:flex;gap:9px;padding:0 18px;margin-top:4px}
.modal-ft .btn{flex:1}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
  transform:translate(-50%,14px);z-index:90;
  background:var(--surface-3);border:1px solid var(--line);border-radius:999px;
  padding:9px 17px;font-size:13px;font-weight:600;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--tab-h:0px}
  .app{flex-direction:row}
  .tabbar{display:none}
  .sidenav{
    display:flex;flex-direction:column;gap:2px;width:216px;flex:none;
    padding:16px 12px;border-right:1px solid var(--line-soft);
    position:sticky;top:0;height:100dvh;background:var(--bg-2);
  }
  .sidenav .brand{padding:6px 8px 20px}
  .sidenav button{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);
    font-size:13.5px;font-weight:600;color:var(--ink-2);text-align:left;
  }
  .sidenav button svg{width:18px;height:18px;stroke-width:1.9;color:var(--ink-3)}
  .sidenav button:hover{background:var(--surface)}
  .sidenav button[aria-current="page"]{background:rgba(255,107,44,.12);color:var(--heat)}
  .sidenav button[aria-current="page"] svg{color:var(--heat)}
  .col{display:flex;flex-direction:column;flex:1;min-width:0}
  .topbar .brand{display:none}
  .topbar{justify-content:flex-end}
  main{padding:22px 28px 60px}
  .tiles{grid-template-columns:repeat(4,1fr);gap:12px}
  .hero{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:14px;align-items:stretch}
  .hero .tiles{grid-template-columns:repeat(2,1fr)}
  .hero .gauge-card{display:flex;flex-direction:column;justify-content:center}
  .sidenav .brand small{white-space:nowrap;letter-spacing:.11em;font-size:9.5px}
  .sidenav .brand h1{font-size:19px}
  .trade-body{grid-template-columns:1fr 1fr}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .two .card + .card{margin-top:0}
  .modal-bd{align-items:center}
  .modal{border-radius:var(--r-xl);max-height:82dvh}
  .toast{bottom:26px}
}
@media (max-width:899px){ .sidenav{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }

/* ---------- rules ---------- */
.rules-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rules-meta{display:flex;align-items:flex-end;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.rules-title{font-size:26px;text-transform:uppercase;letter-spacing:.03em}

.rules-layout{display:block}
.toc{
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:14px;overflow:hidden;
}
.toc-hd{
  display:flex;align-items:center;gap:8px;padding:11px 14px;
  font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);
}
.toc-hd svg{width:15px;height:15px}
.toc ol{list-style:none;margin:0;padding:6px;counter-reset:toc;max-height:none;overflow:visible}
.toc li{counter-increment:toc}
.toc a{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  text-decoration:none;font-size:13.5px;color:var(--ink-2);line-height:1.35;
}
.toc a::before{
  content:counter(toc,decimal-leading-zero);
  font-family:var(--f-display);font-size:10.5px;font-weight:700;color:var(--ink-3);
  flex:none;width:18px;
}
.toc a span{flex:1;min-width:0}
.toc a:hover{background:var(--surface-2)}
.toc a.on{background:rgba(255,107,44,.12);color:var(--heat)}
.toc a.on::before{color:var(--heat)}
.toc-dot{
  flex:none;font-style:normal;font-size:10px;font-weight:700;
  min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  display:grid;place-items:center;
  background:rgba(255,107,44,.16);color:var(--heat);border:1px solid rgba(255,107,44,.3);
}

.rulebook{font-size:14px;line-height:1.65}
.rule-sec{scroll-margin-top:80px}
.rule-sec + .rule-sec{margin-top:30px;padding-top:26px;border-top:1px solid var(--line-soft)}
.rule-sec h2{
  font-size:19px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;
  display:flex;align-items:center;
}
.rule-sec > ul{list-style:none;margin:0;padding:0}
.rule-item{
  position:relative;padding:5px 0 5px 18px;scroll-margin-top:86px;
  color:var(--ink-2);
}
.rule-item::before{
  content:"";position:absolute;left:3px;top:13px;width:5px;height:5px;border-radius:50%;
  background:var(--surface-3);
}
.rule-item.d1{padding-left:38px} .rule-item.d1::before{left:23px;width:4px;height:4px}
.rule-item.d2{padding-left:58px} .rule-item.d2::before{left:43px;width:4px;height:4px;border-radius:1px}
.rule-item.d3{padding-left:78px} .rule-item.d3::before{left:63px;width:4px;height:4px;border-radius:1px}
.rule-item.d0{color:var(--ink)}
.rule-text{display:inline}

/* change marks */
.rule-item.mk-added,.rule-item.mk-changed{
  border-radius:6px;margin:2px 0;
}
.rule-item.mk-added{background:rgba(61,220,151,.07);box-shadow:inset 2px 0 0 var(--mint)}
.rule-item.mk-changed{background:rgba(255,107,44,.07);box-shadow:inset 2px 0 0 var(--heat)}
.rule-flag{
  display:inline-block;vertical-align:1px;margin-right:7px;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:1px 6px;border-radius:99px;
}
.rule-flag.mint{background:rgba(61,220,151,.16);color:var(--mint)}
.rule-flag.heat{background:rgba(255,107,44,.16);color:var(--heat)}
.rule-flag.red{background:rgba(255,77,94,.16);color:var(--red)}

ins{text-decoration:none;background:rgba(61,220,151,.18);color:#9BF0C8;border-radius:3px;padding:0 2px}
del{text-decoration:line-through;text-decoration-color:var(--red);background:rgba(255,77,94,.12);
  color:var(--ink-3);border-radius:3px;padding:0 2px}

.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,20%{background:rgba(255,107,44,.22)}100%{background:transparent}}

.chg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.chg li{padding-left:12px;border-left:2px solid var(--line)}
.chg-sec{
  display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  color:var(--ink-3);text-decoration:none;margin-bottom:4px;
}
.chg-sec:hover{color:var(--heat)}
.chg-body{font-size:13.5px;line-height:1.6;color:var(--ink-2)}

@media (min-width:900px){
  .rules-layout{display:grid;grid-template-columns:246px 1fr;gap:18px;align-items:start}
  .toc{position:sticky;top:80px;margin-bottom:0;max-height:calc(100dvh - 110px);display:flex;flex-direction:column}
  .toc ol{overflow-y:auto}
}
@media (max-width:899px){
  .toc ol{max-height:236px;overflow-y:auto}
}

/* ---------- accordions ---------- */
.acc-hd{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 16px;border-radius:var(--r-lg) var(--r-lg) 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);
}

.acc-hd.sub{
  border-top:1px solid var(--line-soft);border-radius:0;
  padding:11px 16px;font-size:13px;font-weight:600;color:var(--ink-2);background:none;
}

.acc-hd[aria-expanded="true"] .acc-caret{transform:rotate(90deg)}
.acc-hd:active{background:var(--surface-2)}
.acc-bd{display:none}
.card.acc.open > .acc-bd,.acc-bd.open{display:block}
.card.acc > .acc-bd{border-top:1px solid var(--line-soft)}

.pay-line{border-bottom:1px solid var(--line-soft)}
.pay-line:last-child{border-bottom:none}
.pay-hd{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px;
}
.pay-hd:disabled{opacity:.75;cursor:default}
.pay-hd .grow{flex:1;min-width:0}
.pay-hd .s{font-size:11.5px;color:var(--ink-3)}
.pay-val{font-family:var(--f-display);font-size:19px;font-weight:700;flex:none}

.pay-line .acc-caret{transition:transform .18s}
.pay-line.open .acc-caret{transform:rotate(90deg)}

.pay-rows li{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:6px 0;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line-soft);

}

}
.rate-in{

  border-radius:0;padding:1px 0 2px;font-size:13px;font-weight:600;

.cell-in{

  padding:4px 6px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-3);

  box-shadow:0 0 0 3px rgba(255,107,44,.14);color:var(--ink)}

td.cell-part .cell-in{color:var(--gold);font-weight:600}
table.dt tbody tr.total.sub td{background:none;font-weight:500;border-top:none}

/* ---------- payout paid state ---------- */
.pay-rows li{display:flex;align-items:center;gap:12px}
.pay-who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay-rows b{flex:none;min-width:56px;text-align:right}
.paid-btn{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  padding:4px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  transition:background .14s,color .14s,border-color .14s;
}
.paid-btn svg{width:12px;height:12px;stroke-width:2.6}
.paid-btn:hover{border-color:var(--ink-3);color:var(--ink-2)}
.paid-btn.on{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.35);color:var(--mint)}
.paid-tag{
  flex:none;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);
}

.dot-owed{
  width:7px;height:7px;border-radius:50%;background:var(--red);flex:none;margin-right:2px;
  box-shadow:0 0 7px -1px var(--red);
}
.owed-flag{color:var(--gold);font-weight:700;margin-left:3px}

.mg-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.mg-actions .btn{flex:1;min-width:110px}

WR","Kaytron Allen":"RB","Zachariah Branch":"WR","Nicholas Singleton":"RB","Ted Hurst":"WR","Malachi Fields":"WR","Mike Washington":"RB","Ja'Kobi Lane":"WR","Brenen Thompson":"WR","Demond Claiborne":"RB","Kareem Hunt":"RB","Bam Knight":"RB","Roschon Johnson":"RB","Breece Hall":"RB","Hassan Haskins":"RB","Rashee Rice":"WR","Mark Andrews":"TE","Rhamondre Stevenson":"RB","Jacory Croskey-Merritt":"RB","Oronde Gadsden":"TE","Harold Fannin":"TE","Shedeur Sanders":"QB","Tory Horton":"WR","Woody Marks":"RB","Kyle Monangai":"RB","Isaac TeSlaa":"WR","Chimere Dike":"WR","Terrance Ferguson":"TE","Pat Bryant":"WR","Daniel Jones":"QB","Chris Rodriguez":"RB"}},"rules":{"_README":"One rulebook per season. Items carry a stable `id`, which is what makes the year-over-year diff meaningful: copy a season with tools/new_rulebook.py and the ids come with it, so an edited item reads as CHANGED rather than as a delete plus an add. `status` is draft or published; drafts are only visible to a signed-in commissioner.","seasons":{"2025":{"status":"published","published":"2025-06-16","basedOn":null,"summary":"The founding rulebook for Sweaty Dynasty v2.","sections":[{"id":"tldr","title":"TL;DR","items":[{"id":"tldr-revival-drafts-we-will-start-with","depth":0,"text":"Revival Drafts: We will start with a 3-6 asset keeper/dispersal draft. Managers can keep players and/or picks, and may later draft players and/or picks in the dispersal draft. The rookie draft will follow the dispersal draft."},{"id":"tldr-buy-in-50-year-partial-full","depth":0,"text":"Buy-In: $50/year. Partial/full due must be paid in order to trade future draft picks."},{"id":"tldr-payouts-are-split-into-three-categories","depth":0,"text":"Payouts are split into three categories: minigames/awards, yearly payout, and the empire rolling pot."},{"id":"tldr-roster-1-qb-2-rb-3","depth":0,"text":"Roster: 1 QB, 2 RB, 3 WR, 1 TE, 3 FLX, 14 bench, 3 IR, 4 Taxi"},{"id":"tldr-scoring-modified-1-qb-tep-tight","depth":0,"text":"Scoring: Modified 1 QB TEP (tight end premium). Added first down scoring and QB boosts."},{"id":"tldr-trading-no-vetoes-conditional-trades-are","depth":0,"text":"Trading: No vetoes. Conditional trades are here!"},{"id":"tldr-waivers-faab-format-100-in-season","depth":0,"text":"Waivers: FAAB format. $100 in-season and $100 offseason FAAB."},{"id":"tldr-playoffs-toilet-bowl-6-team-playoff","depth":0,"text":"Playoffs & Toilet Bowl: 6-team playoff. 6 seed is a Points For wildcard spot. Championship side placement matchups will determine draft order. Small FAAB reward for toilet bowl 7th and 9th place winners."},{"id":"tldr-rookie-draft-order-tanking-true-tanking","depth":0,"text":"Rookie Draft Order & Tanking: True tanking is allowed. Non-playoff team draft order is determined by MAX PF. Playoff team draft order determined by placement matchups."},{"id":"tldr-empire-scoring-format-2-titles-wins","depth":0,"text":"Empire Scoring Format: 2 titles wins the Empire and the rolling empire pot. 1 title plus other quality finishes can also win the empire. The league will reset with a 5 asset keeper/dispersal draft."},{"id":"tldr-important-dates-trade-period-6-14","depth":0,"text":"Important Dates: Trade Period: 6/14-6/20. Cutdown day: 6/21. Dispersal draft: 6/2-completion. Rookie draft: TBD"},{"id":"tldr-replacement-managers-if-you-must-leave","depth":0,"text":"Replacement Managers: If you must leave the league, please help find your replacement manager. The adopting manager will keep all accumulated empire points from that team."},{"id":"tldr-league-end-of-life-if-managers","depth":0,"text":"League End of Life: If managers collectively decide to end the league, the empire pot will be split among the managers, proportionate to their share of league-wide empire points."}]},{"id":"revival","title":"Revival Drafts","items":[{"id":"revival-welcome-to-sweaty-dynasty-v2-to","depth":0,"text":"Welcome to Sweaty Dynasty v2! To revive the league from the dead, we will begin with a partial dispersal draft. Here's how it works:"},{"id":"revival-each-manager-must-select-between-3","depth":0,"text":"Each manager must select between 3 and 6 assets they wish to keep. These assets may be players or draft picks."},{"id":"revival-to-maintain-competitive-fairness-managers-will","depth":0,"text":"To maintain competitive fairness, managers will be required to send their keeper selections to the commissioner by the cutdown deadline."},{"id":"revival-if-a-manager-does-not-have","depth":0,"text":"If a manager does not have their picks in at the deadline, the top three assets (as defined by current SF, TEP value on Keep Trade Cut) will be chosen."},{"id":"revival-every-player-that-is-not-selected","depth":0,"text":"Every player that is not selected as a 'keeper' will then go back into a league-wide player pool."},{"id":"revival-the-league-will-then-draft-from","depth":0,"text":"The league will then draft from the player pool as they would in a startup. Each manager will be able to draft any non-rookie player, including kickers, which will represent the non-kept rookie draft picks."},{"id":"revival-the-first-kicker-picked-will-represent","depth":0,"text":"The first kicker picked will represent the first remaining (non-keeper) draft pick. If picks 1.01 through 1.08 were all selected as keeper picks by their respective managers, 1.09 would be the first available pick on the board and would be represented by the first kicker drafted."},{"id":"revival-the-order-of-the-draft-will","depth":0,"text":"The order of the draft will be determined randomly after the keeper selections have been made. This will be a linear draft."},{"id":"revival-managers-that-keep-only-3-assets","depth":0,"text":"Managers that keep only 3 assets will begin drafting in the 1st round. Managers that keep 4, 5, and 6 players will forego their 1st, 1st and 2nd, and 1st 2nd and 3rd round picks, respectively. As picks can't be 'cancelled', managers will be asked to select a non-relevant player (retired, defense, etc.) as a dummy pick."},{"id":"revival-after-the-dispersal-draft-we-will","depth":0,"text":"After the dispersal draft, we will do a full rookie draft based on the picks kept by managers and kickers drafted in the dispersal draft."}]},{"id":"buyin","title":"Buy-In","items":[{"id":"buyin-50-year","depth":0,"text":"$50/year"},{"id":"buyin-if-a-manager-wants-to-trade","depth":0,"text":"If a manager wants to trade a future pick (2026 and beyond for league year 2025), they must pay some or all of that year's entry fee."},{"id":"buyin-1st-round-pick-full-buy-in","depth":1,"text":"1st Round Pick: Full buy-in"},{"id":"buyin-2nd-3rd-round-pick-half-buy","depth":1,"text":"2nd/3rd Round Pick: Half buy-in"},{"id":"buyin-at-the-start-of-that-season","depth":0,"text":"At the start of that season, the manager must pay any remainder of the year's entry fee."}]},{"id":"payouts","title":"Payouts","items":[{"id":"payouts-the-total-pot-for-the-first","depth":0,"text":"The total pot for the first year (with a $50 entry fee) is $500. Payouts are split into 3 categories."},{"id":"payouts-mini-games-awards-200-total-10","depth":0,"text":"Mini-games & awards -- $200 total, $10 per minigame"},{"id":"payouts-a-minigame-runs-most-weeks-of","depth":1,"text":"A minigame runs most weeks of the regular season, plus league-voted post-season awards. Week-by-week winners are tracked on the Games tab rather than here, so the rulebook stays about rules."},{"id":"payouts-weeks-with-no-minigame-scheduled-and","depth":1,"text":"Weeks with no minigame scheduled, and any minigame cancelled during the season, are simply not paid out."},{"id":"payouts-yearly-payout-150-total","depth":0,"text":"Yearly payout -- $150 total"},{"id":"payouts-1st-place-100","depth":1,"text":"1st Place: $100"},{"id":"payouts-2nd-place-50","depth":1,"text":"2nd Place: $50"},{"id":"payouts-empire-rolling-pot-150-per-year","depth":0,"text":"Empire rolling pot -- $150 per year"},{"id":"payouts-this-number-will-grow-year-over","depth":1,"text":"This number will grow year-over-year until someone meets the criteria to win the Empire."}]},{"id":"roster","title":"Roster","items":[{"id":"roster-starting-lineup","depth":0,"text":"Starting lineup"},{"id":"roster-qb","depth":1,"text":"QB"},{"id":"roster-rb","depth":1,"text":"RB"},{"id":"roster-rb-2","depth":1,"text":"RB"},{"id":"roster-wr","depth":1,"text":"WR"},{"id":"roster-wr-2","depth":1,"text":"WR"},{"id":"roster-wr-3","depth":1,"text":"WR"},{"id":"roster-te","depth":1,"text":"TE"},{"id":"roster-w-r-t","depth":1,"text":"W/R/T"},{"id":"roster-w-r-t-2","depth":1,"text":"W/R/T"},{"id":"roster-w-r-t-3","depth":1,"text":"W/R/T"},{"id":"roster-14-bench-spots","depth":0,"text":"14 Bench Spots"},{"id":"roster-3-ir-spots","depth":0,"text":"3 IR Spots"},{"id":"roster-only-players-on-ir-or-ruled","depth":1,"text":"Only players on IR or ruled 'OUT' may be placed on the IR list."},{"id":"roster-4-taxi-spots","depth":0,"text":"4 Taxi Spots"},{"id":"roster-1st-and-2nd-year-players-rookies","depth":1,"text":"1st and 2nd year players (rookies and sophomores) are allowed on the taxi squad. The taxi squad will 'lock' at the start of the season. A player can be elevated from the taxi squad at any point, however, that empty spot will remain for the rest of the year."}]},{"id":"scoring","title":"Scoring Format","items":[{"id":"scoring-modified-1-qb-tep-tight-end","depth":0,"text":"Modified 1-QB TEP (tight end premium)"},{"id":"scoring-we-will-be-making-some-changes","depth":0,"text":"We will be making some changes to the overall scoring format to make a unique dynasty experience and provide a needed boost to some undervalued positions - namely quarterback and tight end."},{"id":"scoring-passing","depth":0,"text":"Passing"},{"id":"scoring-yards-0-05-pts-yd-1","depth":1,"text":"Yards: 0.05 pts/YD (1 point every 20 yards)"},{"id":"scoring-touchdown-6-points","depth":1,"text":"Touchdown: 6 points"},{"id":"scoring-1st-down-0-1-points","depth":1,"text":"1st Down: 0.1 points"},{"id":"scoring-2-point-conversion-2-points","depth":1,"text":"2-Point Conversion: 2 points"},{"id":"scoring-interception-2-points","depth":1,"text":"Interception: -2 points"},{"id":"scoring-pick-6-6-points","depth":1,"text":"Pick 6: -6 points"},{"id":"scoring-completion-0-1-points","depth":1,"text":"Completion: 0.1 points"},{"id":"scoring-incompletion-0-05-points","depth":1,"text":"Incompletion: -0.05 points"},{"id":"scoring-sack-1-point","depth":1,"text":"Sack: -1 point"},{"id":"scoring-rushing","depth":0,"text":"Rushing"},{"id":"scoring-yards-0-1-pts-yd-1","depth":1,"text":"Yards: 0.1 pts/YD (1 point every 10 yards)"},{"id":"scoring-touchdown-6-points-2","depth":1,"text":"Touchdown: 6 points"},{"id":"scoring-1st-down-0-5-points","depth":1,"text":"1st Down: 0.5 points"},{"id":"scoring-2-point-conversion-2-points-2","depth":1,"text":"2-Point Conversion: 2 points"},{"id":"scoring-receiving","depth":0,"text":"Receiving"},{"id":"scoring-yards-0-1-pts-yd-1-2","depth":1,"text":"Yards: 0.1 pts/YD (1 point every 10 yards)"},{"id":"scoring-reception-0-5-points-1-point","depth":1,"text":"Reception: 0.5 points (1 point for TEs)"},{"id":"scoring-touchdown-6-points-3","depth":1,"text":"Touchdown: 6 points"},{"id":"scoring-1st-down-0-5-points-2","depth":1,"text":"1st Down: 0.5 points"},{"id":"scoring-2-point-conversion-2-points-3","depth":1,"text":"2-Point Conversion: 2 points"},{"id":"scoring-other","depth":0,"text":"Other"},{"id":"scoring-fumble-1-point","depth":1,"text":"Fumble: -1 point"},{"id":"scoring-lost-fumble-2-points","depth":1,"text":"Lost fumble: -2 points"},{"id":"scoring-fumble-recovery-td-6-points","depth":1,"text":"Fumble Recovery TD: 6 points"}]},{"id":"trading","title":"Trading","items":[{"id":"trading-draft-pick-trading","depth":0,"text":"Draft Pick Trading"},{"id":"trading-if-a-manager-trades-away-a","depth":1,"text":"If a manager trades away a draft pick, they must pay some or all of that year's entry fee:"},{"id":"trading-1st-round-pick-full-buy-in","depth":1,"text":"1st Round Pick: Full buy-in"},{"id":"trading-2nd-3rd-round-pick-half-buy","depth":1,"text":"2nd/3rd Round Pick: Half buy-in"},{"id":"trading-managers-can-trade-for-picks-in","depth":1,"text":"Managers can trade for picks in the current year and the following three years."},{"id":"trading-i-e-for-league-year-2025","depth":1,"text":"I.e. for league year 2025, managers can trade 2025 (current rookie draft), 2026, 2027, and 2028 picks."},{"id":"trading-conditional-trades-general-guidelines","depth":0,"text":"Conditional trades -- general guidelines"},{"id":"trading-managers-are-encouraged-to-call-their","depth":1,"text":"Managers are encouraged to \"call their shot.\" Use conditions to wager players, picks, or FAAB based on specific, measurable outcomes (e.g., \"If Player X scores 8+ TDs this season, Team A sends a 2026 3rd-round pick to Team B\")."},{"id":"trading-all-conditions-must-be-directly-tied","depth":1,"text":"All conditions must be directly tied to real-life football outcomes or fantasy performance. They must not rely on external or subjective factors (e.g., \"If I get a new job\" is not a valid condition)."},{"id":"trading-all-conditional-terms-must-be-submitted","depth":1,"text":"All conditional terms must be submitted to the commissioner in writing (chat, email, or league message board) at the time of the trade. Both parties must confirm the terms."},{"id":"trading-all-conditional-trades-must-be-approved","depth":1,"text":"All conditional trades must be approved by the commissioner to validate terms."},{"id":"trading-conditional-trades-asset-locking-restrictions","depth":0,"text":"Conditional trades -- asset locking & restrictions"},{"id":"trading-conditional-assets-players-picks-or-faab","depth":1,"text":"Conditional assets (players, picks, or FAAB that are \"on the line\" in a trade) will remain on the original manager's team until the condition is resolved."},{"id":"trading-these-conditional-assets-are-frozen-they","depth":1,"text":"These conditional assets are frozen. They may not be traded, dropped, or used in a separate condition until the original condition resolves."},{"id":"trading-conditional-trades-acceptable-examples","depth":0,"text":"Conditional trades -- acceptable examples"},{"id":"trading-if-jayden-daniels-finishes-as-a","depth":1,"text":"\"If Jayden Daniels finishes as a top-12 QB this season, I send a 2026 2nd.\""},{"id":"trading-if-malik-nabers-out-scores-jordan","depth":1,"text":"\"If Malik Nabers out-scores Jordan Addison rest-of-season (Weeks 7-17), I owe you $20 FAAB.\""},{"id":"trading-if-i-win-the-championship-and","depth":1,"text":"\"If I win the championship and Puka Nacua averages 20+ points per game over the playoff stretch, the 2026 2nd turns to a 2027 1st.\""},{"id":"trading-conditional-trades-disputes","depth":0,"text":"Conditional trades -- disputes"},{"id":"trading-if-a-dispute-arises-over-unclear","depth":1,"text":"If a dispute arises over unclear or ambiguous conditions, the commissioner will resolve it based on the original written record, the intent of the trade, and logic and fairness."},{"id":"trading-trade-deadline","depth":0,"text":"Trade Deadline"},{"id":"trading-trades-must-be-accepted-prior-to","depth":1,"text":"Trades must be accepted prior to the end of the final game in week 14 (per Sleeper restrictions)."},{"id":"trading-vetoes","depth":0,"text":"Vetoes"},{"id":"trading-this-is-a-no-veto-league","depth":1,"text":"This is a NO VETO league. Managers are expected to manage their teams intelligently and play with integrity. If a manager is found to have colluded, they will be banned from the league and will forfeit any entry fee payments made toward subsequent years."},{"id":"trading-if-a-manager-has-a-history","depth":1,"text":"If a manager has a history of egregious - albeit non-collusive - roster transactions, they may be asked to leave the league to maintain competitive fairness."}]},{"id":"waivers","title":"Waivers","items":[{"id":"waivers-faab-format","depth":0,"text":"FAAB format"},{"id":"waivers-offseason","depth":0,"text":"Offseason"},{"id":"waivers-managers-will-be-given-100-in","depth":1,"text":"Managers will be given $100 in offseason FAAB. This can be spent following the Super Bowl until the start of the next regular season."},{"id":"waivers-in-season","depth":0,"text":"In-Season"},{"id":"waivers-managers-will-be-given-100-in-2","depth":1,"text":"Managers will be given $100 in in-season FAAB to spend during that league year."},{"id":"waivers-carryover","depth":0,"text":"Carryover"},{"id":"waivers-in-season-and-offseason-faab-do","depth":1,"text":"In-Season and Offseason FAAB do NOT carry over. Use it or lose it."}]},{"id":"playoffs","title":"Playoffs & Toilet Bowl","items":[{"id":"playoffs-championship-bracket","depth":0,"text":"Championship Bracket"},{"id":"playoffs-3-rounds-weeks-15-17-6","depth":1,"text":"3 rounds (weeks 15-17), 6 teams"},{"id":"playoffs-placement-matchups-will-determine-draft-picks","depth":1,"text":"Placement matchups will determine draft picks (see Rookie Draft Order & Tanking below)"},{"id":"playoffs-toilet-bowl","depth":0,"text":"Toilet Bowl"},{"id":"playoffs-2-rounds-weeks-15-16-4","depth":1,"text":"2 rounds (weeks 15-16), 4 teams"},{"id":"playoffs-7th-and-9th-place-winners-rewarded","depth":1,"text":"7th and 9th place winners rewarded with FAAB (see Rookie Draft Order & Tanking below)"},{"id":"playoffs-seeding","depth":0,"text":"Seeding"},{"id":"playoffs-the-best-two-records-get-the","depth":1,"text":"The best two records get the first and second seeds and the two first round byes. The 3rd, 4th, and 5th best records get the 3rd, 4th, and 5th seeds, respectively. The final 6th seed goes to the remaining team with the highest PF."},{"id":"playoffs-1-best-record-bye","depth":1,"text":"1. Best record (BYE)"},{"id":"playoffs-2-second-best-record-bye","depth":1,"text":"2. Second best record (BYE)"},{"id":"playoffs-3-third-best-record","depth":1,"text":"3. Third best record"},{"id":"playoffs-         ${state.view === k ? 'aria-current="page"' : ''}>${icon(VIEWS[k].icon)}${VIEWS[k].label}</button>`).join('')}
  </div>`;

  document.body.addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]');
    if (b) go(b.dataset.view);
    if (e.target.closest('[data-sheet]')) openSheet();
  });
  $('#sheetBd').addEventListener('click', closeSheet);
  $('#seasonSel').addEventListener('change', (e) => { db.season = Number(e.target.value); });
}

const openSheet  = () => { $('#sheet').classList.add('open'); $('#sheetBd').classList.add('open'); };
const closeSheet = () => { $('#sheet')?.classList.remove('open'); $('#sheetBd')?.classList.remove('open'); };


/* ============================================================
   COLLAPSIBLE SECTIONS
   Every top-level `.section-title` gets its following siblings wrapped and
   becomes a real toggle. Done here rather than in each view so no section
   can be missed, and so the marker only ever appears where it works.
   Collapsed state is remembered per view.
   ============================================================ */
const COLLAPSE_KEY = 'sweatydyno:collapsed:v1';

const readCollapsed = () => {
  try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]')); }
  catch { return new Set(); }
};
const writeCollapsed = (set) => {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...set])); } catch { /* private mode */ }
};

function wireSections(main, view) {
  const collapsed = readCollapsed();
  // direct children only: titles nested inside cards or modals are labels, not sections
  for (const title of [...main.children].filter((n) => n.classList?.contains('section-title'))) {
    const body = document.createElement('div');
    body.className = 'sec-body';
    let n = title.nextElementSibling;
    while (n && !n.classList.contains('section-title')) {
      const next = n.nextElementSibling;
      body.appendChild(n);
      n = next;
    }
    if (!body.childElementCount) continue;   // nothing to collapse — leave it inert
    title.after(body);

    if (!title.querySelector('.sec-mark')) {
      const mark = document.createElement('i');
      mark.className = 'sec-mark';
      mark.setAttribute('aria-hidden', 'true');
      mark.innerHTML = '<b></b><b></b>';
      title.prepend(mark);
    }

    const key = `${view}|${title.textContent.trim().slice(0, 40)}`;
    const set = (open) => {
      title.setAttribute('aria-expanded', String(open));
      title.querySelector('.sec-mark')?.classList.toggle('open', open);
      body.hidden = !open;
    };
    set(!collapsed.has(key));

    title.setAttribute('role', 'button');
    title.setAttribute('tabindex', '0');
    const toggle = () => {
      const open = title.getAttribute('aria-expanded') !== 'true';
      set(open);
      const c = readCollapsed();
      open ? c.delete(key) : c.add(key);
      writeCollapsed(c);
    };
    title.addEventListener('click', toggle);
    title.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  }
}

/* ---------- render ---------- */
function paint() {
  const v = VIEWS[state.view];
  const main = $('#main');
  if (!main) return;
  if (main._spy) { window.removeEventListener('scroll', main._spy); main._spy = null; }
  try {
    main.innerHTML = v.mod.render(db, state);
    v.mod.mount?.(main, db, go, setState, state.params || {});
    wireSections(main, state.view);
  } catch (err) {
    console.error(err);
    main.innerHTML = `<div class="card"><div class="card-bd">
      <div class="banner">${icon('alert')}<div><b>${esc(v.label)} hit an error.</b><br>
      <span style="font-family:ui-monospace,monospace;font-size:11.5px">${esc(err.message)}</span></div></div></div></div>`;
  }
  document.querySelectorAll('[data-view]').forEach((b) => {
    if (b.dataset.view === state.view) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  const sel = $('#seasonSel');
  if (sel && Number(sel.value) !== db.season) sel.value = db.season;
  // Only jump to the top when the section actually changed. Expanding a row or
  // switching a tab within a view must leave the reader where they were.
  if (paint._last !== state.view) {
    paint._last = state.view;
    main.scrollTop = 0;
    window.scrollTo({ top: 0 });
  }
}

/* ---------- boot ---------- */
(async function boot() {
  try {
    await db.init();
  } catch (err) {
    document.getElementById('boot-fallback')?.remove();
    document.body.innerHTML = `<div style="max-width:520px;margin:16vh auto;padding:26px;font-family:system-ui;color:#EAF0F6">
      <h1 style="font-size:22px;margin-bottom:10px">Couldn't load the league data</h1>
      <p style="color:#A9B6C6;line-height:1.6;font-size:14px">${esc(err.message)}</p>
      ${globalThis.__SD_DATA ? '' : `<p style="color:#6D7C8E;line-height:1.6;font-size:13px">This app uses ES modules and
      <code>fetch</code>, so it has to be served over http — opening <code>index.html</code> straight off the disk
      won't work. Run <code style="color:#FF6B2C">python3 -m http.server 8000</code> in this folder and visit
      <code>localhost:8000</code>, or double-click <code>sweaty-dyno.html</code> instead.</p>`}</div>`;
    return;
  }
  Object.assign(state, parseHash());
  shell();
  paint();
  window.addEventListener('hashchange', () => setState(parseHash()));
  db.on(() => {
    const sel = $('#seasonSel');
    if (sel) sel.value = db.season;
    paint();
  });
})();

return {};
})();

</script>
</body>
</html>
