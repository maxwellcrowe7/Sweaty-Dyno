  flex:1 1 0;min-width:0;font-size:12px;color:var(--ink-3);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mg-edit{margin-top:11px}

/* Editing lives on the thing itself: a pencil that surfaces when you hover its
   parent, so the affordance is where the thing is rather than a button buried
   somewhere below it. Touch devices have no hover, so there it stays visible. */
.edit-pencil{
  flex:none;display:grid;place-items:center;width:22px;height:22px;
  border-radius:var(--r-sm);color:var(--ink-3);
}
.edit-pencil svg{width:15px;height:15px}
.edit-pencil:hover,.edit-pencil:focus-visible{color:var(--heat)}
@media (hover:hover){
  .edit-pencil{opacity:0;transition:opacity .14s}
  /* whatever holds it reveals it -- no per-container selector to remember */
  *:hover > .edit-pencil,.edit-pencil:focus-visible{opacity:1}
}


@media (max-width:420px){
  .mg-bd{padding-left:14px}
  .mg-win{max-width:88px}
  /* no room for it alongside a winner and a prize — it is in the detail anyway */
  .mg-sum{display:none}
  .mg-places .pl{min-width:52px}
}

/* ---------- guillotine ---------- */
/* Collapsed it is a single line, like a minigame row; the weeks inside then
   open one at a time. */
.guil .card-hd{padding:0;gap:0}
.guil-toggle{
  display:flex;align-items:center;gap:10px;width:100%;min-width:0;
  text-align:left;padding:14px 16px;cursor:pointer;
}
.guil-toggle .gap{flex:1;min-width:0}
.guil-toggle:focus-visible{outline:2px solid var(--heat);outline-offset:-2px}
/* name and its one-line summary share a line, exactly like a minigame row */
.guil-main{display:flex;align-items:baseline;gap:8px;min-width:0}
.guil-main h3{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guil-toggle .chip{flex:none}
.guil .acc-caret{transition:transform .18s;color:var(--ink-3);flex:none}
.guil.open > .card-hd .acc-caret{transform:rotate(90deg)}
.guil-bd{display:none}
.guil.open .guil-bd{display:block}
/* nothing below it to divide from, so the header is the whole card */
.guil:not(.open) .card-hd{border-bottom:none;border-radius:var(--r-lg)}

/* the pool: who is still in, who has gone */
.guil-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.gp{
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
}
.gp .wk{font-family:var(--f-display);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3)}
.gp svg{width:13px;height:13px}
/* chopped: greyed back, with a red line through the name */
.gp.out{
  background:transparent;border-color:rgba(255,77,94,.2);color:var(--ink-3);font-weight:500;
  text-decoration:line-through;text-decoration-color:rgba(255,77,94,.7);
}
.gp.win{color:var(--gold);border-color:rgba(245,196,81,.4);background:rgba(245,196,81,.1)}

.guil-weeks{display:flex;flex-direction:column}
.gw{border-bottom:2px solid var(--line)}
.gw:last-child{border-bottom:none}
.gw-hd{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 16px}
.gw-hd .wk{font-family:var(--f-display);font-size:10.5px;font-weight:700;letter-spacing:.09em;
  color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;
  padding:2px 6px;flex:none;min-width:34px;text-align:center}
.gw-hd .grow{flex:1;min-width:0}
.gw .acc-caret{transition:transform .18s}
.gw.open .acc-caret{transform:rotate(90deg)}
.gw-out{font-size:13.5px;font-weight:600}
.gw-win{font-size:11.5px;color:var(--gold);display:flex;align-items:center;gap:5px;margin-top:3px}
.gw-win svg{width:13px;height:13px}
.gw-wait{font-size:13px;color:var(--ink-3)}
.gw-score{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--ink-2);flex:none}
.gw-bd{display:none}
.gw.open .gw-bd{display:block}
.gw-scores{list-style:none;margin:0;padding:2px 16px 12px 44px}
.gw-scores li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;
  border-top:1px solid var(--line-soft)}
.gw-scores li:first-child{border-top:none}
.gw-scores .rank{font-family:var(--f-display);font-size:10.5px;font-weight:700;color:var(--ink-3);
  width:16px;flex:none}
.gw-scores .who{flex:1;min-width:0}
.gw-scores b{font-family:var(--f-display);font-size:14px;font-weight:700;flex:none}
.gw-scores li.out .who b{color:var(--red)}
.gw-scores li.out b{color:var(--red)}
.gw-scores li.out .rank{color:var(--red)}
.gw-force{padding:0 16px 13px 44px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gw-force label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.gw-force select{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:5px 8px;font-size:12.5px}
.carry{font-size:10.5px;color:var(--ink-3);font-weight:500;margin-top:2px;white-space:nowrap}

/* ---------- info popover ---------- */
.info{
  display:inline-grid;place-items:center;width:15px;height:15px;flex:none;
  border-radius:50%;border:1px solid var(--line);background:var(--surface-2);
  font-family:var(--f-body);font-size:9.5px;font-weight:700;font-style:italic;
  line-height:1;color:var(--ink-3);cursor:pointer;vertical-align:middle;
  margin-left:5px;letter-spacing:0;text-transform:none;
  transition:color .14s,border-color .14s,background .14s;
}
.info:hover,.info:focus-visible{color:var(--heat);border-color:rgba(255,107,44,.45);
  background:rgba(255,107,44,.10);outline:none}
.info-pop{
  position:absolute;z-index:80;
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--ink-2);
  box-shadow:var(--shadow);pointer-events:none;
  opacity:0;transform:translateY(-3px);transition:opacity .14s,transform .14s;
  text-align:left;font-weight:400;letter-spacing:0;text-transform:none;
}
.info-pop.show{opacity:1;transform:translateY(0)}

/* ---------- connection status ---------- */
.conn{display:flex;align-items:flex-start;gap:11px}
.conn-dot{
  width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;
}
.conn-dot.on{background:var(--mint);box-shadow:0 0 8px -1px var(--mint)}
.conn-dot.off{background:var(--gold);box-shadow:0 0 8px -1px var(--gold)}
.conn-main{font-size:13.5px;font-weight:600}
.conn-sub{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:2px}

</style>

et keeper/dispersal draft. Managers can keep players and/or picks, and may later draft players and/or picks in the dispersal draft. The rookie draft will follow the dispersal draft."},{"id":"tldr-buy-in-50-year-partial-full","depth":0,"text":"Buy-In: $50/year. Partial/full due must be paid in order to trade future draft picks."},{"id":"tldr-payouts-are-split-into-three-categories","depth":0,"text":"Payouts are split into three categories: minigames/awards, yearly payout, and the empire rolling pot."},{"id":"tldr-roster-1-qb-2-rb-3","depth":0,"text":"Roster: 1 QB, 2 RB, 3 WR, 1 TE, 3 FLX, 14 bench, 3 IR, 4 Taxi"},{"id":"tldr-scoring-modified-1-qb-tep-tight","depth":0,"text":"Scoring: Modified 1 QB TEP (tight end premium). Added first down scoring and QB boosts."},{"id":"tldr-trading-no-vetoes-conditional-trades-are","depth":0,"text":"Trading: No vetoes. Conditional trades are here!"},{"id":"tldr-waivers-faab-format-100-in-season","depth":0,"text":"Waivers: FAAB format. $100 in-season and $100 offseason FAAB."},{"id":"tldr-playoffs-toilet-bowl-6-team-playoff","depth":0,"text":"Playoffs & Toilet Bowl: 6-team playoff. 6 seed is a Points For wildcard spot. Championship side placement matchups will determine draft order. Small FAAB reward for toilet bowl 7th and 9th place winners."},{"id":"tldr-rookie-draft-order-tanking-true-tanking","depth":0,"text":"Rookie Draft Order & Tanking: True tanking is allowed. Non-playoff team draft order is determined by MAX PF. Playoff team draft order determined by placement matchups."},{"id":"tldr-empire-scoring-format-2-titles-wins","depth":0,"text":"Empire Scoring Format: 2 titles wins the Empire and the rolling empire pot. 1 title plus other quality finishes can also win the empire. The league will reset with a 5 asset keeper/dispersal draft."},{"id":"tldr-important-dates-trade-period-6-14","depth":0,"text":"Important Dates: Trade Period: 6/14-6/20. Cutdown day: 6/21. Dispersal draft: 6/2-completion. Rookie draft: TBD"},{"id":"tldr-replacement-managers-if-you-must-leave","depth":0,"text":"Replacement Managers: If you must leave the league, please help find your replacement manager. The adopting manager will keep all accumulated empire points from that team."},{"id":"tldr-league-end-of-life-if-managers","depth":0,"text":"League End of Life: If managers collectively decide to end the league, the empire pot will be split among the managers, proportionate to their share of league-wide empire points."}]},{"id":"revival","title":"Revival Drafts","items":[{"id":"revival-welcome-to-sweaty-dynasty-v2-to","depth":0,"text":"Welcome to Sweaty Dynasty v2! To revive the league from the dead, we will begin with a partial dispersal draft. Here's how it works:"},{"id":"revival-each-manager-must-select-between-3","depth":0,"text":"Each manager must select between 3 and 6 assets they wish to keep. These assets may be players or draft picks."},{"id":"revival-to-maintain-competitive-fairness-managers-will","depth":0,"text":"To maintain competitive fairness, managers will be required to send their keeper selections to the commissioner by the cutdown deadline."},{"id":"revival-if-a-manager-does-not-have","depth":0,"text":"If a manager does not have their picks in at the deadline, the top three assets (as defined by current SF, TEP value on Keep Trade Cut) will be chosen."},{"id":"revival-every-player-that-is-not-selected","depth":0,"text":"Every player that is not selected as a 'keeper' will then go back into a league-wide player pool."},{"id":"revival-the-league-will-then-draft-from","depth":0,"text":"The league will then draft from the player pool as they would in a startup. Each manager will be able to draft any non-rookie player, including kickers, which will represent the non-kept rookie draft picks."},{"id":"revival-the-first-kicker-picked-will-represent","depth":0,"text":"The first kicker picked will represent the first remaining (non-keeper) draft pick. If picks 1.01 through 1.08 were all selected as keeper picks by their respective managers, 1.09 would be the first available pick on the board and would be represented by the first kicker drafted."},{"id":"revival-the-order-of-the-draft-will","depth":0,"text":"The order of the draft will be determined randomly after the keeper selections have been made. This will be a linear draft."},{"id":"revival-managers-that-keep-only-3-assets","depth":0,"text":"Managers that keep only 3 assets will begin drafting in the 1st round. Managers that keep 4, 5, and 6 players will forego their 1st, 1st and 2nd, and 1st 2nd and 3rd round picks, respectively. As picks can't be 'cancelled', managers will be asked to select a non-relevant player (retired, defense, etc.) as a dummy pick."},{"id":"revival-after-the-dispersal-draft-we-will","depth":0,"text":"After the dispersal draft, we will do a full rookie draft based on the picks kept by managers and kickers drafted in the dispersal draft."}]},{"id":"buyin","title":"Buy-In","items":[{"id":"buyin-50-year","depth":0,"text":"$50/year"},{"id":"buyin-if-a-manager-wants-to-trade","depth":0,"text":"If a manager wants to trade a future pick (2026 and beyond for league year 2025), they must pay some or all of that year's entry fee."},{"id":"buyin-1st-round-pick-full-buy-in","depth":1,"text":"1st Round Pick: Full buy-in"},{"id":"buyin-2nd-3rd-round-pick-half-buy","depth":1,"text":"2nd/3rd Round Pick: Half buy-in"},{"id":"buyin-at-the-start-of-that-season","depth":0,"text":"At the start of that season, the manager must pay any remainder of the year's entry fee."}]},{"id":"payouts","title":"Payouts","items":[{"id":"payouts-the-total-pot-for-the-first","depth":0,"text":"The total pot for the first year (with a $50 entry fee) is $500. Payouts are split into 3 categories."},{"id":"payouts-mini-games-awards-200-total-10","depth":0,"text":"Mini-games & awards -- $200 total, $10 per minigame"},{"id":"payouts-a-minigame-runs-most-weeks-of","depth":1,"text":"A minigame runs most weeks of the regular season, plus league-voted post-season awards. Week-by-week winners are tracked on the Games tab rather than here, so the rulebook stays about rules."},{"id":"payouts-weeks-with-no-minigame-scheduled-and","depth":1,"text":"Weeks with no minigame scheduled, and any minigame cancelled during the season, are simply not paid out."},{"id":"payouts-yearly-payout-150-total","depth":0,"text":"Yearly payout -- $150 total"},{"id":"payouts-1st-place-100","depth":1,"text":"1st Place: $100"},{"id":"payouts-2nd-place-50","depth":1,"text":"2nd Place: $50"},{"id":"payouts-empire-rolling-pot-150-per-year","depth":0,"text":"Empire rolling pot -- $150 per year"},{"id":"payouts-this-number-will-grow-year-over","depth":1,"text":"This number will grow year-over-year until someone meets the criteria to win the Empire."}]},{"id":"roster","title":"Roster","items":[{"id":"roster-starting-lineup","depth":0,"text":"Starting lineup"},{"id":"roster-qb","depth":1,"text":"QB"},{"id":"roster-rb","depth":1,"text":"RB"},{"id":"roster-rb-2","depth":1,"text":"RB"},{"id":"roster-wr","depth":1,"text":"WR"},{"id":"roster-wr-2","depth":1,"text":"WR"},{"id":"roster-wr-3","depth":1,"text":"WR"},{"id":"roster-te","depth":1,"text":"TE"},{"id":"roster-w-r-t","depth":1,"text":"W/R/T"},{"id":"roster-w-r-t-2","depth":1,"text":"W/R/T"},{"id":"roster-w-r-t-3","depth":1,"text":"W/R/T"},{"id":"roster-14-bench-spots","depth":0,"text":"14 Bench Spots"},{"id":"roster-3-ir-spots","depth":0,"text":"3 IR Spots"},{"id":"roster-only-players-on-ir-or-ruled","depth":1,"text":"Only players on IR or ruled 'OUT' may be placed on the IR list."},{"id":"roster-4-taxi-spots","depth":0,"text":"4 Taxi Spots"},{"id":"roster-1st-and-2nd-year-players-rookies","depth":1,"text":"1st and 2nd year players (rookies and sophomores) are allowed on the taxi squad. The taxi squad will 'lock' at the start of the season. A player can be elevated from the taxi squad at any point, however, that empty spot will remain for the rest of the year."}]},{"id":"scoring","title":"Scoring Format","items":[{"id":"scoring-modified-1-qb-tep-tight-end","depth":0,"text":"Modified 1-QB TEP (tight end premium)"},{"id":"scoring-we-will-be-making-some-changes","depth":0,"text":"We will be making some changes to the overall scoring format to make a unique dynasty experience and provide a needed boost to some undervalued positions - namely quarterback and tight end."},{"id":"scoring-passing","depth":0,"text":"Passing"},{"id":"scoring-yards-0-05-pts-yd-1","depth":1,"text":"Yards: 0.05 pts/YD (1 point every 20 yards)"},{"id":"scoring-touchdown-6-points","depth":1,"text":"Touchdown: 6 points"},{"id":"scoring-1st-down-0-1-points","depth":1,"text":"1st Down: 0.1 points"},{"id":"scoring-2-point-conversion-2-points","depth":1,"text":"2-Point Conversion: 2 points"},{"id":"scoring-interception-2-points","depth":1,"text":"Interception: -2 points"},{"id":"scoring-pick-6-6-points","depth":1,"text":"Pick 6: -6 points"},{"id":"scoring-completion-0-1-points","depth":1,"text":"Completion: 0.1 points"},{"id":"scoring-incompletion-0-05-points","depth":1,"text":"Incompletion: -0.05 points"},{"id":"scoring-sack-1-point","depth":1,"text":"Sack: -1 point"},{"id":"scoring-rushing","depth":0,"text":"Rushing"},{"id":"scoring-yards-0-1-pts-yd-1","depth":1,"text":"Yards: 0.1 pts/YD (1 point every 10 yards)"},{"id":"scoring-touchdown-6-points-2","depth":1,"text":"Touchdown: 6 points"},{"id":"scoring-1st-down-0-5-points","depth":1,"text":"1st Down: 0.5 points"},{"id":"scoring-2-point-conversion-2-points-2","depth":1,"text":"2-Point Conversion: 2 points"},{"id":"scoring-receiving","depth":0,"text":"Receiving"},{"id":"scoring-yards-0-1-pts-yd-1-2","depth":1,"text":"Yards: 0.1 pts/YD (1 point every 10 yards)"},{"id":"scoring-reception-0-5-points-1-point","depth":1,"text":"Reception: 0.5 points (1 point for TEs)"},{"id":"scoring-touchdown-6-points-3","depth":1,"text":"Touchdown: 6 points"},{"id":"scoring-1st-down-0-5-points-2","depth":1,"text":"1st Down: 0.5 points"},{"id":"scoring-2-point-conversion-2-points-3","depth":1,"text":"2-Point Conversion: 2 points"},{"id":"scoring-other","depth":0,"text":"Other"},{"id":"scoring-fumble-1-point","depth":1,"text":"Fumble: -1 point"},{"id":"scoring-lost-fumble-2-points","depth":1,"text":"Lost fumble: -2 points"},{"id":"scoring-fumble-recovery-td-6-points","depth":1,"text":"Fumble Recovery TD: 6 points"}]},{"id":"trading","title":"Trading","items":[{"id":"trading-draft-pick-trading","depth":0,"text":"Draft Pick Trading"},{"id":"trading-if-a-manager-trades-away-a","depth":1,"text":"If a manager trades away a draft pick, they must pay some or all of that year's entry fee:"},{"id":"trading-1st-round-pick-full-buy-in","depth":1,"text":"1st Round Pick: Full buy-in"},{"id":"trading-2nd-3rd-round-pick-half-buy","depth":1,"text":"2nd/3rd Round Pick: Half buy-in"},{"id":"trading-managers-can-trade-for-picks-in","depth":1,"text":"Managers can trade for picks in the current year and the following three years."},{"id":"trading-i-e-for-league-year-2025","depth":1,"text":"I.e. for league year 2025, managers can trade 2025 (current rookie draft), 2026, 2027, and 2028 picks."},{"id":"trading-conditional-trades-general-guidelines","depth":0,"text":"Conditional trades -- general guidelines"},{"id":"trading-managers-are-encouraged-to-call-their","depth":1,"text":"Managers are encouraged to \"call their shot.\" Use conditions to wager players, picks, or FAAB based on specific, measurable outcomes (e.g., \"If Player X scores 8+ TDs this season, Team A sends a 2026 3rd-round pick to Team B\")."},{"id":"trading-all-conditions-must-be-directly-tied","depth":1,"text":"All conditions must be directly tied to real-life football outcomes or fantasy performance. They must not rely on external or subjective factors (e.g., \"If I get a new job\" is not a valid condition)."},{"id":"trading-all-conditional-terms-must-be-submitted","depth":1,"text":"All conditional terms must be submitted to the commissioner in writing (chat, email, or league message board) at the time of the trade. Both parties must confirm the terms."},{"id":"trading-all-conditional-trades-must-be-approved","depth":1,"text":"All conditional trades must be approved by the commissioner to validate terms."},{"id":"trading-conditional-trades-asset-locking-restrictions","depth":0,"text":"Conditional trades -- asset locking & restrictions"},{"id":"trading-conditional-assets-players-picks-or-faab","depth":1,"text":"Conditional assets (players, picks, or FAAB that are \"on the line\" in a trade) will remain on the original manager's team until the condition is resolved."},{"id":"trading-these-conditional-assets-are-frozen-they","depth":1,"text":"These conditional assets are frozen. They may not be traded, dropped, or used in a separate condition until the original condition resolves."},{"id":"trading-conditional-trades-acceptable-examples","depth":0,"text":"Conditional trades -- acceptable examples"},{"id":"trading-if-jayden-daniels-finishes-as-a","depth":1,"text":"\"If Jayden Daniels finishes as a top-12 QB this season, I send a 2026 2nd.\""},{"id":"trading-if-malik-nabers-out-scores-jordan","depth":1,"text":"\"If Malik Nabers out-scores Jordan Addison rest-of-season (Weeks 7-17), I owe you $20 FAAB.\""},{"id":"trading-if-i-win-the-championship-and","depth":1,"text":"\"If I win the championship and Puka Nacua averages 20+ points per game over the playoff stretch, the 2026 2nd turns to a 2027 1st.\""},{"id":"trading-conditional-trades-disputes","depth":0,"text":"Conditional trades -- disputes"},{"id":"trading-if-a-dispute-arises-over-unclear","depth":1,"text":"If a dispute arises over unclear or ambiguous conditions, the commissioner will resolve it based on the original written record, the intent of the trade, and logic and fairness."},{"id":"trading-trade-deadline","depth":0,"text":"Trade Deadline"},{"id":"trading-trades-must-be-accepted-prior-to","depth":1,"text":"Trades must be accepted prior to the end of the final game in week 14 (per Sleeper restrictions)."},{"id":"trading-vetoes","depth":0,"text":"Vetoes"},{"id":"trading-this-is-a-no-veto-league","depth":1,"text":"This is a NO VETO league. Managers are expected to manage their teams intelligently and play with integrity. If a manager is found to have colluded, they will be banned from the league and will forfeit any entry fee payments made toward subsequent years."},{"id":"trading-if-a-manager-has-a-history","depth":1,"text":"If a manager has a history of egregious - albeit non-collusive - roster transactions, they may be asked to leave the league to maintain competitive fairness."}]},{"id":"waivers","title":"Waivers","items":[{"id":"waivers-faab-format","depth":0,"text":"FAAB format"},{"id":"waivers-offseason","depth":0,"text":"Offseason"},{"id":"waivers-managers-will-be-given-100-in","depth":1,"text":"Managers will be given $100 in offseason FAAB. This can be spent following the Super Bowl until the start of the next regular season."},{"id":"waivers-in-season","depth":0,"text":"In-Season"},{"id":"waivers-managers-will-be-given-100-in-2","depth":1,"text":"Managers will be given $100 in in-season FAAB to spend during that league year."},{"id":"waivers-carryover","depth":0,"text":"Carryover"},{"id":"waivers-in-season-and-offseason-faab-do","depth":1,"text":"In-Season and Offseason FAAB do NOT carry over. Use it or lose it."}]},{"id":"playoffs","title":"Playoffs & Toilet Bowl","items":[{"id":"playoffs-championship-bracket","depth":0,"text":"Championship Bracket"},{"id":"playoffs-3-rounds-weeks-15-17-6","depth":1,"text":"3 rounds (weeks 15-17), 6 teams"},{"id":"playoffs-placement-matchups-will-determine-draft-picks","depth":1,"text":"Placement matchups will determine draft picks (see Rookie Draft Order & Tanking below)"},{"id":"playoffs-toilet-bowl","depth":0,"text":"Toilet Bowl"},{"id":"playoffs-2-rounds-weeks-15-16-4","depth":1,"text":"2 rounds (weeks 15-16), 4 teams"},{"id":"playoffs-7th-and-9th-place-winners-rewarded","depth":1,"text":"7th and 9th place winners rewarded with FAAB (see Rookie Draft Order & Tanking below)"},{"id":"playoffs-seeding","depth":0,"text":"Seeding"},{"id":"playoffs-the-best-two-records-get-the","depth":1,"text":"The best two records get the first and second seeds and the two first round byes. The 3rd, 4th, and 5th best records get the 3rd, 4th, and 5th seeds, respectively. The final 6th seed goes to the remaining team with the highest PF."},{"id":"playoffs-1-best-record-bye","depth":1,"text":"1. Best record (BYE)"},{"id":"playoffs-2-second-best-record-bye","depth":1,"text":"2. Second best record (BYE)"},{"id":"playoffs-3-third-best-record","depth":1,"text":"3. Third best record"},{"id":"playoffs-4-fourth-best-record","depth":1,"text":"4. Fourth best record"},{"id":"playoffs-5-fifth-best-record","depth":1,"text":"5. Fifth best record"},{"id":"playoffs-6-highest-pf-of-remaining-teams","depth":1,"text":"6. Highest PF of remaining teams"},{"id":"playoffs-because-the-6-seed-may-be","depth":1,"text":"Because the 6 seed may be one of the stronger teams with worse matchup luck throughout the season, the first seed will have the option to switch bracket sides with the two seed."}]},{"id":"draftorder","title":"Rookie Draft Order & Tanking","items":[{"id":"draftorder-tanking-is-allowed-but-barriers-will","depth":0,"text":"Tanking is allowed, but barriers will be installed to prevent teams from artificially boosting their draft positions."},{"id":"draftorder-non-playoff-teams","depth":0,"text":"Non-playoff teams"},{"id":"draftorder-the-draft-order-of-the-four","depth":1,"text":"The draft order of the four non-playoff teams will be determined by Max Points For (MPF). MPF for each week can be seen in the weekly report."},{"id":"draftorder-the-team-with-the-lowest-mpf","depth":1,"text":"The team with the lowest MPF will receive the 1st overall pick. The second, third, and fourth lowest will receive the second, third, and fourth overall picks, respectively."},{"id":"draftorder-toilet-bowl-rewards","depth":0,"text":"Toilet bowl rewards"},{"id":"draftorder-to-incentivize-competition-in-the-toilet","depth":1,"text":"To incentivize competition in the toilet bowl, small FAAB rewards will be given to the winners of placement matchups. The manager may choose whether to have the FAAB applied to the offseason or in-season budget."},{"id":"draftorder-7th-place-50-faab","depth":1,"text":"7th Place: $50 FAAB"},{"id":"draftorder-9th-place-25-faab","depth":1,"text":"9th Place: $25 FAAB"},{"id":"draftorder-playoff-teams","depth":0,"text":"Playoff teams"},{"id":"draftorder-the-draft-order-of-the-playoff","depth":1,"text":"The draft order of the playoff teams will be determined by the results of the placement matchups, and are designed to incentivize effort in otherwise meaningless matchups."},{"id":"draftorder-championship-matchup-1st-place-1-10","depth":1,"text":"Championship Matchup -- 1st Place: 1.10, 2nd Place: 1.09"},{"id":"draftorder-3rd-place-matchup-3rd-place-1","depth":1,"text":"3rd Place Matchup -- 3rd Place: 1.07, 4th Place: 1.08"},{"id":"draftorder-5th-place-matchup-5th-place-1","depth":1,"text":"5th Place Matchup -- 5th Place: 1.05, 6th Place: 1.06"}]},{"id":"empire","title":"Empire Scoring Format","items":[{"id":"empire-point-breakdown","depth":0,"text":"Point Breakdown"},{"id":"empire-playoff-berth-3-points","depth":1,"text":"Playoff berth: 3 points"},{"id":"empire-semi-final-berth-5-points","depth":1,"text":"Semi-final berth: 5 points"},{"id":"empire-title-game-berth-10-points","depth":1,"text":"Title game berth: 10 points"},{"id":"empire-champion-20-points","depth":1,"text":"Champion: 20 points"},{"id":"empire-winning-the-empire","depth":0,"text":"Winning the Empire"},{"id":"empire-the-first-manager-with-2-titles","depth":1,"text":"The first manager with 2 titles OR 1 title and 50+ points wins the pot."},{"id":"empire-in-the-event-that-a-2x","depth":1,"text":"In the event that a 2x champion is crowned in the same season as another manager reaches 50 points, the 2x champion will win the Empire Pot."},{"id":"empire-once-the-empire-is-won-the","depth":1,"text":"Once the Empire is won, the league will reset with a 5 asset keeper/dispersal draft."}]},{"id":"dates","title":"Important Dates","items":[{"id":"dates-trade-period-6-16-6-00","depth":0,"text":"Trade Period: 6/16 (6:00 PM) - 6/23 (5:59 PM)"},{"id":"dates-cutdown-day-6-24-11-59","depth":0,"text":"Cutdown Day: 6/24 (11:59 PM deadline)"},{"id":"dates-dispersal-draft-6-25-completion","depth":0,"text":"Dispersal Draft: 6/25 - completion"},{"id":"dates-rookie-draft-tbd","depth":0,"text":"Rookie Draft: TBD"}]},{"id":"replacement","title":"Replacement Managers","items":[{"id":"replacement-manager-responsibility","depth":0,"text":"Manager responsibility"},{"id":"replacement-it-is-the-responsibility-of-the","depth":1,"text":"It is the responsibility of the manager to - if at all possible - assist with the search for a replacement manager."},{"id":"replacement-empire-points-stick-with-the-team","depth":0,"text":"Empire points stick with the team, not the manager"},{"id":"replacement-if-a-manager-abandons-their-team","depth":1,"text":"If a manager abandons their team at 30 points, the replacement manager will inherit the team with a full 30 points."}]},{"id":"eol","title":"League End of Life","items":[{"id":"eol-in-the-event-that-the-managers","depth":0,"text":"In the event that the managers decide to scrap the league prior to the Empire Pot being won, the total pot will be dispersed among the league members proportionate to their share of league-wide empire points."},{"id":"eol-example-there-are-250-total-empire","depth":0,"text":"Example: There are 250 total empire points in the league. The manager in first place (45 points) would get 18% (45/250) of the pot."}]}]}}}};

   The anon key is DESIGNED to be public — it only grants what your

   Never put the service_role key here; that one bypasses RLS.
   ============================================================ */
const SUPABASE = {

};

__M["js/migrate.js"] = (function () {
/* ============================================================
   MIGRATIONS
   Data can arrive from an older publish (Supabase still holding last
   week's shape) or from a stale export. Coerce it on load rather than
   letting the views do arithmetic on the wrong types — a boolean `paid`
   silently summing as $1 is worse than a loud failure.
   ============================================================ */
function migrate(data) {
  const d = data || {};

  // buy-ins: { amount: 50, paid: true } -> { paid: 50 }
  if (d.bank?.payins) {
    for (const p of d.bank.payins) {
      if (typeof p.paid === 'boolean') p.paid = p.paid ? (Number(p.amount) || 0) : 0;
      else p.paid = Number(p.paid) || 0;
      delete p.amount;
      delete p.note;
      delete p.date;
    }
  }
  // Payout amounts used to be stored rows. They are derived now, so convert the
  // old rows into placement config plus a record of who was actually paid.
  if (d.bank?.payouts) {
    d.bank.settled ||= [];
    const seen = new Set(d.bank.settled.map((x) => `${x.season}:${x.category}:${x.team}`));
    d.league ||= {};

    // Points alone never claim it, so progress has to be measured against both.
    const titlesNeeded = L.empireTitlesToWin ?? 2;
    // Points come from where a team finished, not a second hand-kept list.
    const scale = Object.fromEntries((L.empirePointsScale || []).map((x) => [x.place, x.points]));
    const finishes = b.finishes || [];
    const board = this.teams().map((t) => {
      const bySeason = Object.fromEntries(this.seasons.map((s) => [s,
        finishes.filter((f) => f.season === s && f.team === t.number)
          .reduce((a, f) => a + (Number(scale[f.place]) || 0), 0)]));
      const total = Object.values(bySeason).reduce((a, x) => a + x, 0);
      const titles = finishes.filter((f) => f.team === t.number && f.place === 1).length;
      const ptsPct = L.empireThreshold ? Math.min(1, total / L.empireThreshold) : 0;
      const titlePct = titlesNeeded ? Math.min(1, titles / titlesNeeded) : 0;
      const eligible = !L.empireRequiresTitle || titles >= 1;
      return {
        ...t, bySeason, total, titles, eligible, ptsPct,
        needsTitle: L.empireRequiresTitle && titles === 0,
        titlesToGo: Math.max(0, titlesNeeded - titles),
        pointsToGo: Math.max(0, (L.empireThreshold || 0) - total),
        // closest of the two routes
        pct: Math.max(titlePct, eligible ? ptsPct : 0),
        wins: titles >= titlesNeeded || (eligible && total >= (L.empireThreshold || Infinity)),
      };
      // Points order, because that is what the race actually shows. A tie goes to
      // whoever has a title -- they are the one who can claim it -- then team number.
    }).sort((a, b2) => b2.total - a.total || b2.titles - a.titles || a.number - b2.number);
    return { pot, contributions, board, threshold: L.empireThreshold,
             titlesToWin: titlesNeeded, requiresTitle: Boolean(L.empireRequiresTitle),
             claimed: b.empirePot?.claimedBy ?? null };
  }

  /* ---------- minigames ---------- */
  minigames(season = this.season) {
    const s = this.get('minigames').seasons[String(season)];
    return s || { games: [], guillotine: null, legacy: null };
  }
  /** Minigames grouped by phase, each already in the order they are played. */
  minigamePhases(season = this.season) {
    const games = this.minigames(season).games || [];
    const ord = (g) => (g.phase === 'week' ? g.week : g.order) ?? 0;
    const pick = (ph) => games.filter((g) => (g.phase || 'week') === ph).sort((a, b) => ord(a) - ord(b));
    return [
      { phase: 'pre',  title: 'Preseason',   games: pick('pre') },
      { phase: 'week', title: 'Weekly slate', games: pick('week') },
      { phase: 'post', title: 'Post-season',  games: pick('post') },
    ];
  }

  /** Allocated and awarded money per phase — what the season's money bar draws. */
  minigameBreakdown(season = this.season) {
    const s = this.minigames(season);
    const pay = (g) => Object.values(g.payout || {}).reduce((a, v) => a + (Number(v) || 0), 0);
    const won = (g) => Object.entries(g.results || {})
      .filter(([, r]) => r?.team).reduce((a, [pl]) => a + (Number(g.payout?.[pl]) || 0), 0);
    const part = (phase, title) => {
      const games = s.games.filter((g) => (g.phase || 'week') === phase);
      return { key: phase, title,
               allocated: games.reduce((a, g) => a + pay(g), 0),
               awarded: games.reduce((a, g) => a + won(g), 0),
               games: games.filter((g) => g.name).length };
    };
    const gp = Number(s.guillotine?.payout?.['1']) || 0;
    const parts = [
      part('pre', 'Preseason'), part('week', 'Weekly'), part('post', 'Post-season'),
      { key: 'guil', title: 'Guillotine', allocated: s.guillotine ? gp : 0,
        awarded: s.guillotine?.winner ? gp : 0, games: s.guillotine ? 1 : 0 },
    ];
    const allocated = parts.reduce((a, p) => a + p.allocated, 0);
    const budget = this.minigameBudget(season);
    return {
      parts, allocated,
      awarded: parts.reduce((a, p) => a + p.awarded, 0),
      games: parts.reduce((a, p) => a + p.games, 0),
      budget, unallocated: budget - allocated, over: Math.max(0, allocated - budget),
    };
  }

  /** What the rules allow for minigames this season. */
  minigameBudget(season = this.season) {
    const b = this.league.minigameBudget || {};
    return Number(b[String(season)] ?? b.default) || 0;
  }

  minigameSpend(season = this.season) {
    const s = this.minigames(season);
    const won = (g) => Object.entries(g.results || {})
      .filter(([, r]) => r?.team).reduce((a, [pl]) => a + (Number(g.payout?.[pl]) || 0), 0);
    const paid = s.games.reduce((a, g) => a + won(g), 0)
      + (s.guillotine?.winner ? (Number(s.guillotine.payout?.['1']) || 0) : 0)

    const committed = s.games.reduce((a, g) => a + Object.values(g.payout || {}).reduce((x, y) => x + (Number(y) || 0), 0), 0)
      + Object.values(s.guillotine?.payout || {}).reduce((x, y) => x + (Number(y) || 0), 0)

    const budget = this.minigameBudget(season);
    const total = paid + (s.legacy?.total || 0);
    return {
      paid: total,
      committed,                       // what the slate adds up to
      remaining: committed - total,    // still to be won from that slate
      budget,                          // what the rules allow
      unallocated: budget - committed, // room left to add prizes
    };
  }

  /**
   * The guillotine, played out from the weekly scores rather than typed in.
   * Each week the lowest-scoring survivor is chopped, so the run is a pure
   * function of the results — it cannot disagree with the scoreboard.
   * `overrides` force a specific chop where a tie or a missing week needs a call.
   */
  guillotineRun(season = this.season) {
    const G = this.minigames(season).guillotine;
    if (!G) return null;

    const entrants = G.entrants?.length ? [...G.entrants] : this.teams(season).map((t) => t.number);
    const start = Number(G.startWeek) || 1;
    // one chop a week until a single manager is left
    const lastWeek = start + entrants.length - 2;

    const byWeek = {};
    for (const w of this.get('stats').weekly)
      if (w.season === season) (byWeek[w.week] ||= {})[w.team] = w.points;

    const overrides = new Map((G.overrides || []).map((o) => [o.week, o.team]));

    let pool = [...entrants];
    const weeks = [];
    for (let wk = start; wk <= lastWeek; wk++) {
      const scores = pool
        .map((t) => ({ team: t, points: byWeek[wk]?.[t] ?? null }))
        .sort((a, b) => (a.points ?? Infinity) - (b.points ?? Infinity) || a.team - b.team);
      const haveAll = scores.length > 0 && scores.every((x) => x.points != null);

      let chopped = overrides.has(wk) ? overrides.get(wk) : null;
      let tied = false;
      if (chopped == null && haveAll) {
        const low = scores[0].points;
        tied = scores.filter((x) => x.points === low).length > 1;
        chopped = scores[0].team;
      }
      weeks.push({
        week: wk,
        scores: scores.map((x) => ({ ...x, chopped: x.team === chopped })),
        chopped, tied,
        forced: overrides.has(wk),
        settled: chopped != null,
        waiting: !haveAll && chopped == null,
      });
      if (chopped == null) break;
      pool = pool.filter((t) => t !== chopped);
    }

    const done = weeks.length === entrants.length - 1 && weeks.every((w) => w.settled);
    return {
      startWeek: start, lastWeek, entrants,
      weeks, survivors: pool,
      winner: G.winner ?? (done && pool.length === 1 ? pool[0] : null),
      complete: done,
      chopped: weeks.filter((w) => w.settled).length,
    };
  }

  /* ---------- stats ---------- */
  stats(season = this.season) {
    const st = this.get('stats');
    const weekly = st.weekly.filter((w) => w.season === season);
    const weeks = [...new Set(weekly.map((w) => w.week))].sort((a, b) => a - b);
    const rows = this.teams(season).map((t) => {
      const mine = weekly.filter((w) => w.team === t.number);
      const total = mine.reduce((a, w) => a + w.points, 0);
      const maxpf = st.maxPF.find((m) => m.season === season && m.team === t.number)?.points ?? null;
      const scores = mine.map((w) => w.points);
      const ceil = mine.filter((w) => w.maxPoints != null);
      const maxTotal = ceil.reduce((a, w) => a + w.maxPoints, 0);
      // Max PF is a whole-season figure, so the ratio is only meaningful once the
      // weekly log actually covers the season. Partial data would report nonsense.
      const fullSeason = mine.length >= (st.regularSeasonWeeks || 14);
      return {
        ...t, total, maxPF: maxpf, games: mine.length, fullSeason,
        avg: mine.length ? total / mine.length : null,
        high: scores.length ? Math.max(...scores) : null,
        low: scores.length ? Math.min(...scores) : null,
        efficiency: fullSeason && maxpf && total ? total / maxpf : null,
        maxTotal: ceil.length ? Math.round(maxTotal * 100) / 100 : null,
        left: ceil.length ? Math.round((maxTotal - total) * 100) / 100 : null,
        byWeek: Object.fromEntries(mine.map((w) => [w.week, w.points])),
        byWeekMax: Object.fromEntries(ceil.map((w) => [w.week, w.maxPoints])),
      };
    });
    return { weeks, rows, weekly, hasData: weekly.length > 0,
             hasMaxPF: rows.some((r) => r.maxPF != null),
             hasEfficiency: rows.some((r) => r.efficiency != null),
             hasCeiling: rows.some((r) => r.maxTotal != null),
             regularSeasonWeeks: st.regularSeasonWeeks || 14 };
  }

  /* ---------- rules ---------- */

  /** Seasons with a rulebook, newest first. Drafts are hidden unless signed in. */
  rulebookSeasons() {
    const r = this.get('rules')?.seasons || {};
    return Object.keys(r).map(Number)
      .filter((s) => r[String(s)].status === 'published' || this.isAdmin)
      .sort((a, b) => b - a);
  }

  rulebook(season) {
    const b = this.get('rules')?.seasons?.[String(season)];
    if (!b) return null;
    if (b.status !== 'published' && !this.isAdmin) return null;
    return { season: Number(season), ...b };
  }

  /** The rulebook a given season was copied from — the diff baseline. */
  previousRulebook(season) {
    const b = this.get('rules')?.seasons?.[String(season)];
    if (!b) return null;
    if (b.basedOn) return this.get('rules').seasons[String(b.basedOn)]
      ? { season: Number(b.basedOn), ...this.get('rules').seasons[String(b.basedOn)] } : null;
    const earlier = Object.keys(this.get('rules').seasons).map(Number)
      .filter((s) => s < Number(season)).sort((a, b2) => b2 - a)[0];
    return earlier == null ? null : { season: earlier, ...this.get('rules').seasons[String(earlier)] };
  }

  /**
   * What changed between a rulebook and the one it was based on.
   * Items carry stable ids, so an edit reads as `changed` rather than as a
   * remove plus an add — which is the whole point of copying last year forward.
   */
  /* ---------- rulebook sections ----------
     Ids are the spine of the diff: a section or rule keeps its id across the
     copy forward, which is what makes an edit read as "changed" rather than as
     a delete plus an add. So ids are minted once, here, and never rewritten. */
  sectionId(title, taken = []) {
    const base = String(title).toLowerCase().replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '').slice(0, 32) || 'section';
    let id = base, n = 2;
    while (taken.includes(id)) id = `${base}-${n++}`;
    return id;
  }

  async addSection(season, title, at = null) {
    const id = this.sectionId(title, this.rulebook(season).sections.map((s) => s.id));
    await this.update('rules', (r) => {
      const secs = r.seasons[String(season)].sections;
      const sec = { id, title: String(title).trim(), items: [] };
      secs.splice(at == null ? secs.length : at, 0, sec);
    });
    return id;
  }

  async renameSection(season, id, title) {
    await this.update('rules', (r) => {
      const sec = r.seasons[String(season)].sections.find((s) => s.id === id);
      if (sec) sec.title = String(title).trim();
    });
  }

  async removeSection(season, id) {
    await this.update('rules', (r) => {
      const bk = r.seasons[String(season)];
      bk.sections = bk.sections.filter((s) => s.id !== id);
    });
  }

  /** Reorder to exactly `ids`. Anything not named keeps its place at the end, so
      a stale list can never silently drop a section. */
  async setSectionOrder(season, ids) {
    await this.update('rules', (r) => {
      const bk = r.seasons[String(season)];
      const by = new Map(bk.sections.map((s) => [s.id, s]));
      const out = [];
      for (const id of ids) if (by.has(id)) { out.push(by.get(id)); by.delete(id); }
      bk.sections = [...out, ...by.values()];
    });
  }

  /** Drop a whole rulebook. Only ever the one season -- every other year keeps
      its own copy, because a book is a snapshot, not a pointer to one. */
  async removeRulebook(season) {
    await this.update('rules', (r) => { delete r.seasons[String(season)]; });
  }

  rulesDiff(season) {
    const cur = this.rulebook(season);
    const prev = this.previousRulebook(season);
    if (!cur || !prev) return null;

    // `index` is where the rule sat in its section: a deleted rule has to be shown
    // back in its own place in the book, not just listed somewhere else
    const flat = (bk) => {
      const m = new Map();
      for (const sec of bk.sections)
        sec.items.forEach((it, i) =>
          m.set(it.id, { ...it, section: sec.id, sectionTitle: sec.title, index: i }));
      return m;
    };
    const A = flat(prev), B = flat(cur);

    const added = [], changed = [], removed = [];
    for (const [id, it] of B) {
      const was = A.get(id);
      if (!was) added.push(it);
      // compare the words, not the markers: bolding a phrase is not a rule change,
      // and flagging it would show a "changed" rule with nothing visibly different
      else if (unfmt(was.text) !== unfmt(it.text)) changed.push({ ...it, was: was.text });
    }
    for (const [id, it] of A) if (!B.has(id)) removed.push(it);

    const prevSecs = new Set(prev.sections.map((s) => s.id));
    const curSecs = new Set(cur.sections.map((s) => s.id));
    const sectionsAdded = cur.sections.filter((s) => !prevSecs.has(s.id));
    // with `index` so a deleted section can be shown back in its place in the rail
    const sectionsRemoved = prev.sections
      .map((s, i) => ({ ...s, index: i }))
      .filter((s) => !curSecs.has(s.id));

    const byId = new Map();
    for (const it of added) byId.set(it.id, 'added');
    for (const it of changed) byId.set(it.id, 'changed');
    const wasById = new Map(changed.map((c) => [c.id, c.was]));

    const perSection = {};
    for (const sec of cur.sections) {
      const a = added.filter((x) => x.section === sec.id).length;
      const c = changed.filter((x) => x.section === sec.id).length;
      const d = removed.filter((x) => x.section === sec.id).length;
      if (a || c || d) perSection[sec.id] = { added: a, changed: c, removed: d, total: a + c + d };
    }

    return {
      from: prev.season, to: cur.season,
      added, changed, removed, sectionsAdded, sectionsRemoved,
      byId, wasById, perSection,
      count: added.length + changed.length + removed.length,
    };
  }

  /* ---------- drafts / trades ---------- */
  draft(season = this.season) { return this.get('drafts').rookie[String(season)] || null; }
  draftSeasons() { return Object.keys(this.get('drafts').rookie).map(Number).sort((a, b) => b - a); }
  position(player) { return this.get('players').positions[player] || null; }
  /** NFL club, learned from Sleeper on a transaction pull. Null until then. */
  nflTeam(player) { return this.get('players').nflTeams?.[player] || null; }

  /**
   * Which season a transaction date belongs to. Sleeper files moves by the week
   * they happened in, which says nothing about a dynasty offseason, so the
   * commissioner sets a window per season in Admin. Falls back to the calendar
   * year, which is what the windows default to.
   */
  seasonOf(date) {
    const d = String(date || '').slice(0, 10);
    if (!d) return null;
    const w = this.league.seasonWindows || {};
    // windows can overlap while a season is being moved; the newer one wins, so
    // opening 2026 early pulls that December straight into the new season
    let hit = null;
    for (const [year, win] of Object.entries(w)) {
      if (!win?.start || !win?.end) continue;
      if (d >= win.start && d <= win.end) hit = Math.max(hit ?? 0, Number(year));
    }
    return hit ?? (Number(d.slice(0, 4)) || null);
  }

  /**
   * The window a season covers, defaulting to its calendar year.
   * `preseasonEnd` is the last offseason day: FAAB budgets are separate either
   * side of it, so in-season simply begins the morning after.
   */
  seasonWindow(year) {
    const w = (this.league.seasonWindows || {})[String(year)];
    return {
      start: w?.start || `${year}-01-01`,
      preseasonEnd: w?.preseasonEnd || `${year}-09-01`,
      end: w?.end || `${year}-12-31`,
    };
  }

  /** The day in-season begins: there is no gap, it is the day after preseason. */
  inSeasonStart(year) {
    const d = new Date(`${this.seasonWindow(year).preseasonEnd}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() + 1);
    return d.toISOString().slice(0, 10);
  }

  /**
   * Which FAAB budget a date spends from. Every manager gets $100 for the
   * offseason and another $100 once the season starts, so a claim has to know
   * which side of the line it fell on.
   */
  faabPhase(date) {
    const d = String(date || '').slice(0, 10);
    const year = this.seasonOf(d);
    if (!year) return null;
    return d <= this.seasonWindow(year).preseasonEnd ? 'pre' : 'in';
  }

  trades(season = null) {
    const t = this.get('trades');
    // the date is what files a transaction, not the season stamped on it at pull
    // time -- so moving a window in Admin re-files everything immediately
    const seasonOf = (x) => (x.date ? this.seasonOf(x.date) : x.season ?? null);
    const f = (x) => season == null || seasonOf(x) === season;
    const byDate = (a, b) => (b.date || '').localeCompare(a.date || '');
    return {
      trades: t.trades.filter(f).slice().sort(byDate),
      conditional: (t.conditions || []).filter(f),
      waivers: t.waivers.filter(f).slice().sort((a, b) => byDate(a, b) || (b.n || 0) - (a.n || 0)),
    };
  }

  /**
   * Where a condition stands, re-read against today so nothing goes stale.
   * A deadline that passes does NOT decide the outcome by itself -- it moves
   * the condition to `due`, which asks the commissioner to say what happened.
   */
  conditionStatus(c) {
    if (c.status === 'met') return { key: 'met', label: 'Condition met', chip: 'mint' };
    if (c.status === 'void') return { key: 'void', label: 'Not met', chip: 'red' };
    if (c.deadline && c.deadline < today())
      return { key: 'due', label: 'Needs a decision', chip: 'gold' };
    return { key: 'open', label: 'Open', chip: 'blue' };
  }

  /** Conditions for a season, newest first, with their trade attached. */
  conditions(season = null) {
    const t = this.get('trades');
    const byId = new Map(t.trades.map((x) => [x.id, x]));
    return (t.conditions || [])
      .filter((c) => season == null || c.season === season)
      .map((c) => ({ ...c, trade: byId.get(c.tradeId) || null, settling: byId.get(c.settledBy) || null }))
      .sort((a, b) => (b.trade?.date || '').localeCompare(a.trade?.date || ''));
  }

  /** The condition attached to a trade, if any. */
  conditionFor(tradeId) { return (this.get('trades').conditions || []).find((c) => c.tradeId === tradeId) || null; }

  /**
   * Every asset frozen by a condition that has not resolved. A lock names the
   * manager holding it -- "the 2026 3rd is locked" is not enough to tell a
   * violation from a settlement.
   */
  lockedAssets(season = null) {
    return this.conditions(season)
      .filter((c) => ['open', 'due'].includes(this.conditionStatus(c).key))
      .flatMap((c) => (c.locks || []).map((l) => ({ ...l, condition: c })));
  }

  /** A lock and a traded asset are the same thing when this says so. */
  sameAsset(lock, asset) {
    if (lock.kind === 'pick') {
      return Boolean(asset.pick) && asset.pick.season === lock.season
        && asset.pick.round === lock.round && asset.pick.origin === lock.origin;
    }
    // FAAB is fungible: any amount owed matches any amount moving
    if (lock.kind === 'faab') return asset.faab != null;
    return !asset.pick && asset.faab == null && lock.label === asset.label;
  }

  /**
   * Locked assets that moved anyway. Sleeper will happily let a manager trade
   * or drop a frozen player, so the app cannot prevent it -- it can only notice,
   * which is what makes a lock more than a sticky note.
   */
  lockBreaks(season = null) {
    const locks = this.lockedAssets(season);
    if (!locks.length) return [];
    const t = this.get('trades');
    const out = [];
    for (const lock of locks) {
      const from = lock.condition.trade?.date || '';
      // the parties to the original deal. An asset moving between them is the
      // condition being settled -- often the whole point of the lock -- so only
      // a move to someone outside that circle counts against it.
      const parties = new Set((lock.condition.trade?.sides || []).map((x) => x.team));
      for (const tr of t.trades) {
        if (tr.id === lock.condition.tradeId || tr.id === lock.condition.settledBy) continue;
        if ((tr.date || '') < from) continue;
        for (const side of tr.sides) {
          for (const raw of side.receives) {
            const a = typeof raw === 'string' ? { label: raw } : raw;
            if (this.sameAsset(lock, a) && side.team !== lock.heldBy && !parties.has(side.team))
              out.push({ lock, trade: tr, how: 'traded' });
          }
        }
      }
      if (lock.kind !== 'player') continue;
      for (const w of t.waivers) {
        if ((w.date || '') < from || w.dropped !== lock.label) continue;
        if (w.team === lock.heldBy) out.push({ lock, move: w, how: 'dropped' });
      }
    }
    return out;
  }

  /* ---------- health checks surfaced in Admin ---------- */
  issues() {
    const out = [];
    const mg = this.get('managers');
    if (mg._placeholder || mg._unconfirmed) out.push({ level: 'warn', text: 'Team numbers are still provisional. Confirm TARGET in tools/remap_teams.py and re-run it.' });
    for (const a of mg.unresolvedAliases || [])
      if (!a.managerId) out.push({ level: 'warn', text: `Alias "${a.alias}" is not mapped to a manager (seen in ${a.seenIn.join(', ')}).` });
    const ids = Object.values(this.league.sleeper.leagueIds).filter(Boolean);
    if (!ids.length) out.push({ level: 'info', text: 'No Sleeper league ID set yet — stat sync is disabled.' });
    const d = this.dirtyKeys();
    if (d.length) out.push({ level: 'edit', text: `Unexported local changes in: ${d.join(', ')}.` });
    if (this.cloudError) out.push({ level: 'warn', text: `Supabase is configured but not serving data yet: ${this.cloudError}` });
    if (this.missingInCloud?.length) out.push({ level: 'warn',
      text: `Not in the database yet: ${this.missingInCloud.join(', ')}. Showing the built-in copy — sign in and Publish to upload.` });
    else if (!this.live) out.push({ level: 'info', text: 'Running on the JSON files. Add your Supabase keys in js/config.js to save changes live.' });
    return out;
  }

  /* ---------- export for committing back to the repo ---------- */
  exportFiles() {
    return FILES.map((f) => ({ name: `${f}.json`, json: JSON.stringify(this.get(f), null, 2) }));
  }
}
const db = new Store(isConfigured() ? new Supabase(SUPABASE) : new JsonAdapter());

const dl = (name, text) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
function mount(root, db) {

    e.preventDefault();

    try {
      await db.auth.signIn(f.email.value.trim(), f.password.value);

      err.textContent = ex.message;
      btn.disabled = false; btn.innerHTML = 'Sign in';

  const chip = root.querySelector('[data-diffchip]');
  const diffBox = root.querySelector('[data-diff]');
  const pushBtn = root.querySelector('[data-push]');

    db.cloudDiff().then((diff) => {
      pending = diff.map((d) => d.key);

        chip.className = 'chip mint'; chip.textContent = 'in sync';
        diffBox.innerHTML = 'The database matches the site copy. Nothing to push.';

        + '<div style="margin-top:8px">Pushing replaces the database copy of these files.</div>';
      if (pushBtn) pushBtn.disabled = false;
    }).catch((e) => {
      chip.className = 'chip red'; chip.textContent = 'check failed';
      diffBox.textContent = e.message;
    });
  }

    const out = root.querySelector('[data-pushout]');
    openModal({
      title: 'Push to database?',
      confirm: `Push ${pending.length} file${pending.length === 1 ? '' : 's'}`,
      body: `<p style="margin:0 0 10px;font-size:13.5px;line-height:1.6">This replaces the database copy of:</p>
        <p style="margin:0 0 12px">${pending.map((k) => `<span class="chip heat" style="margin:0 4px 4px 0">${esc(k)}.json</span>`).join('')}</p>

      onConfirm: async () => {

          await db.publishToCloud(pending, (f) => { out.textContent = `Pushing ${f}.json…`; });

          toast('Database updated');

          out.innerHTML = `<span style="color:var(--red)">${esc(ex.message)}</span>`;
          pushBtn.disabled = false;
        }
      },
    });

    const btn = e.currentTarget;
    const out = root.querySelector('[data-pubout]');

      L.currentSeason = +g('currentSeason');
    });

  });
